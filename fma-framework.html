<script>
// Theme restoration before first paint to prevent FOUC
(function(){
  var t=localStorage.getItem('fma_theme')||'dark';
  if(t==='auto'){
    var d=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme',d?'dark':'light');
  } else {
    document.documentElement.setAttribute('data-theme',t);
  }
})();
</script>
<style>
:root{--bg:#181b22;--bg2:#0e1016;--bg3:#1a1e28;--bg4:#242936;--accent:#4ecdc4;--accent2:#45b7aa;--text:#e0e6ed;--text2:#8892a0;--text3:#5a6270;--red:#ff6b6b;--orange:#ffa94d;--green:#51cf66;--yellow:#ffd43b;--blue:#339af0;--purple:#9775fa;--border:#2a2f3a;--radius:8px;--shadow:0 4px 20px rgba(0,0,0,.4);--layer-workflow:#339af0;--layer-application:#4ecdc4;--layer-platform:#ffa94d;--layer-signal:#8892a0}
[data-theme="light"]{--bg:#eef0f4;--bg2:#ffffff;--bg3:#dde1e8;--bg4:#c8cdd6;--accent:#0d9488;--accent2:#0f766e;--text:#1a1a2e;--text2:#374151;--text3:#6b7280;--red:#dc2626;--orange:#d97706;--green:#16a34a;--yellow:#ca8a04;--blue:#2563eb;--purple:#7c3aed;--border:#b0b8c4;--shadow:0 4px 20px rgba(0,0,0,.12);--layer-workflow:#2563eb;--layer-application:#0d9488;--layer-platform:#d97706;--layer-signal:#6b7280}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:'Fraunces',serif}
code,.mono{font-family:'Space Mono',monospace;font-size:.85em}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
.app-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.app-header h1{font-size:1.3rem;color:var(--accent)}
.app-header h1 span{color:var(--text2);font-weight:400;font-size:.9rem;margin-left:8px}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:8px 16px;border:none;border-radius:var(--radius);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;transition:all .2s}
.btn-primary{background:var(--accent);color:var(--bg)}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg4)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{opacity:.85}
.btn-sm{padding:5px 10px;font-size:.78rem}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.stepper{display:flex;padding:12px 32px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;gap:4px}
.step{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius);cursor:pointer;white-space:nowrap;font-size:.82rem;transition:all .2s;border:1px solid transparent;user-select:none;-webkit-user-select:none}
.step:hover{background:var(--bg3)}
.step.active{background:var(--bg4);border-color:var(--accent);color:var(--accent)}
.step.completed{color:var(--green)}
.step .step-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;background:var(--bg4);flex-shrink:0}
.step.active .step-num{background:var(--accent);color:var(--bg)}
.step.completed .step-num{background:var(--green);color:var(--bg)}
.main{padding:32px;max-width:1500px;margin:0 auto}
.phase-panel{display:none}
.phase-panel.active{display:block}
.phase-header{margin-bottom:24px}
.phase-header h2{font-size:1.6rem;margin-bottom:8px}
.phase-header .desc{color:var(--text2);margin-bottom:12px;line-height:1.5}
.phase-header .deliverables{display:flex;gap:8px;flex-wrap:wrap}
.tag{padding:4px 10px;border-radius:12px;font-size:.75rem;font-weight:500}
.tag-accent{background:rgba(78,205,196,.15);color:var(--accent)}
.tag-green{background:rgba(81,207,102,.15);color:var(--green)}
.tag-orange{background:rgba(255,169,77,.15);color:var(--orange)}
.tag-red{background:rgba(255,107,107,.15);color:var(--red)}
.tag-blue{background:rgba(51,154,240,.15);color:var(--blue)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
.card h3{font-size:1.1rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .cnt{background:var(--bg4);padding:2px 8px;border-radius:12px;font-size:.75rem;font-family:'Space Mono',monospace;color:var(--text2)}
.steps-checklist{list-style:none}
.steps-checklist li{padding:8px 12px;border-left:2px solid var(--border);margin-bottom:4px;display:flex;align-items:center;gap:10px;color:var(--text2);font-size:.9rem;cursor:pointer;transition:all .15s}
.steps-checklist li:hover{background:var(--bg3);border-radius:0 var(--radius) var(--radius) 0}
.steps-checklist li.done{border-left-color:var(--green);color:var(--text)}
.steps-checklist li .ck{width:18px;height:18px;border:2px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.7rem}
.steps-checklist li.done .ck{border-color:var(--green);background:var(--green);color:var(--bg)}
.table-wrap{overflow-x:auto;margin:12px 0}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{background:var(--bg3);padding:10px 12px;text-align:left;font-weight:600;white-space:nowrap;position:sticky;top:0;border-bottom:2px solid var(--accent)}
td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:rgba(78,205,196,.03)}
input[type="text"],input[type="number"],select,textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:4px;font-family:'DM Sans',sans-serif;font-size:.82rem;width:100%;min-width:80px}
td input[type="text"],td select{cursor:default}td input[type="text"]:hover,td input[type="text"]:focus{cursor:text}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(78,205,196,.15)}
textarea{resize:vertical;min-height:60px}
.tg{display:flex;gap:2px}
.tb{padding:4px 10px;border:1px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;font-size:.75rem;font-weight:500;transition:all .15s}
.tb:first-child{border-radius:4px 0 0 4px}
.tb:last-child{border-radius:0 4px 4px 0}
.tb.ay{background:var(--green);color:var(--bg);border-color:var(--green)}
.tb.an{background:var(--red);color:#fff;border-color:var(--red)}
.sb{padding:3px 10px;border-radius:12px;font-size:.78rem;font-weight:600;display:inline-block;user-select:none;-webkit-user-select:none;white-space:nowrap}
.sc{background:rgba(255,107,107,.2);color:var(--red)}
.sh{background:rgba(255,107,107,.2);color:var(--red)}
.sm{background:rgba(255,212,59,.2);color:var(--yellow)}
.sl{background:rgba(81,207,102,.2);color:var(--green)}
.su{background:rgba(51,154,240,.2);color:var(--blue)}
.ss{background:rgba(151,117,250,.2);color:var(--purple)}
.shb{background:rgba(78,205,196,.2);color:var(--accent)}
.sapp{background:rgba(78,205,196,.2);color:var(--accent)}
.sbf{background:rgba(100,149,237,.15);color:#6495ed}
.sr{background:rgba(255,169,77,.2);color:var(--orange)}
.add-row{width:100%;padding:10px;border:2px dashed var(--border);background:transparent;color:var(--text3);cursor:pointer;border-radius:var(--radius);font-size:.85rem;transition:all .15s;margin-top:8px}
.add-row:hover{border-color:var(--accent);color:var(--accent);background:rgba(78,205,196,.05)}
.del{background:none;border:none;color:var(--red);cursor:pointer;font-size:1rem;padding:2px 6px;opacity:.4;transition:opacity .15s}
.del:hover{opacity:1}
.phase-nav{display:flex;justify-content:space-between;margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.st{background:var(--bg3);padding:12px 16px;border-radius:var(--radius);min-width:110px}
.st .lbl{font-size:.72rem;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.st .val{font-size:1.4rem;font-weight:700;font-family:'Space Mono',monospace;margin-top:2px}
.q-help{font-size:.72rem;color:var(--text3);font-style:italic;display:block;margin-top:2px}
.tip{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--bg4);color:var(--text3);font-size:.65rem;cursor:help;margin-left:4px}
.ttbox{position:fixed;z-index:9999;background:#1e2330;color:var(--text);padding:10px 14px;border-radius:8px;font-size:.8rem;max-width:380px;width:max-content;white-space:normal;box-shadow:0 8px 30px rgba(0,0,0,.6);border:1px solid var(--accent);line-height:1.4;pointer-events:none;display:none}
.ttbox.show{display:block}
.ttbox::before{content:'';position:absolute;top:-7px;left:20px;border:7px solid transparent;border-bottom-color:#1e2330}
input[type="text"]{text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
input[type="text"]:focus{white-space:normal;overflow:visible;position:relative;z-index:10}
#mc{contain:layout style}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto}
.modal.modal-wide{max-width:900px}
.modal h3{margin-bottom:16px}
.seq-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:16px}
.seq-tab{padding:10px 20px;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.seq-tab:hover{color:var(--text)}
.seq-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.seq-tab-panel{display:none}
.seq-tab-panel.active{display:block}
.wf-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:12px;flex-wrap:wrap}
.wf-tab{padding:8px 16px;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;user-select:none;-webkit-user-select:none}
.wf-tab:hover{color:var(--text)}
.wf-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.wf-tab-x{background:none;border:none;color:var(--text3);cursor:pointer;font-size:.65rem;padding:0 2px;margin-left:4px;opacity:0;transition:opacity .15s}
.wf-tab:hover .wf-tab-x{opacity:1}
.wf-tab-x:hover{color:var(--red)}

.wf-manager{margin-bottom:12px}
.wf-pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wf-pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;
  background:var(--bg3);border:1px solid var(--border);border-radius:16px;
  font-size:.82rem;color:var(--text)}
.wf-pill-x{background:none;border:none;color:var(--text3);cursor:pointer;font-size:.75rem;padding:0 2px}
.wf-pill-x:hover{color:var(--red)}
.wf-pill-add{background:none;border:1px dashed var(--border);border-radius:16px;
  padding:4px 12px;color:var(--accent);cursor:pointer;font-size:.82rem}
.wf-pill-add:hover{background:var(--bg3);border-color:var(--accent)}

.img-preview-wrap{border:2px dashed var(--border);border-radius:var(--radius);padding:16px;text-align:center;min-height:180px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s;position:relative}
.img-preview-wrap:hover{border-color:var(--accent)}
.img-preview-wrap img{max-width:100%;max-height:300px;border-radius:4px}
.img-preview-wrap .drop-label{color:var(--text3);font-size:.85rem}
.confidence-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--radius);font-size:.82rem;margin:8px 0}
.confidence-high{background:rgba(81,207,102,.12);color:var(--green);border:1px solid rgba(81,207,102,.25)}
.confidence-medium{background:rgba(255,212,59,.12);color:var(--yellow);border:1px solid rgba(255,212,59,.25)}
.confidence-low{background:rgba(255,107,107,.12);color:var(--red);border:1px solid rgba(255,107,107,.25)}
.ocr-progress{padding:12px;border-radius:var(--radius);background:rgba(78,205,196,.08);border:1px solid rgba(78,205,196,.2);font-size:.82rem;color:var(--accent);display:none}
.ocr-progress .bar{height:4px;background:var(--bg4);border-radius:2px;margin-top:8px;overflow:hidden}
.ocr-progress .bar-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s;width:0%}
.llm-settings{padding:10px 14px;border-radius:var(--radius);background:rgba(78,205,196,.06);border:1px solid rgba(78,205,196,.15);margin-bottom:4px}
.llm-settings summary{list-style:none;user-select:none}
.llm-settings summary::-webkit-details-marker{display:none}
.llm-settings[open] summary{margin-bottom:8px}
.intro-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.intro-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column}
.intro-card p{flex:1}
.intro-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.intro-card .pn{font-size:.72rem;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.intro-card h4{margin-bottom:6px}
.intro-card p{font-size:.82rem;color:var(--text2);line-height:1.4}
.intro-card .pb{height:4px;background:var(--bg4);border-radius:2px;margin-top:10px;overflow:hidden}
.intro-card .pf{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.si{display:flex;gap:2px}
.sb2{width:28px;height:28px;border:1px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;font-size:.75rem;font-weight:600;transition:all .15s;display:flex;align-items:center;justify-content:center}
.sb2:first-child{border-radius:4px 0 0 4px}
.sb2:last-child{border-radius:0 4px 4px 0}
.sb2.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
select option{background:var(--bg2);color:var(--text)}
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:768px){.stepper{padding:8px 16px}.main{padding:16px}.app-header{padding:12px 16px;flex-direction:column;gap:8px}.stats{flex-direction:column}}
.step-pending{color:var(--orange)!important;border-left-color:var(--orange)!important}
th:nth-child(2),td:nth-child(2),th:nth-child(5),td:nth-child(5),th:nth-child(10),td:nth-child(10),th:nth-child(15),td:nth-child(15){border-left:2px solid var(--bg4)}
.he-table th,.he-table td{border-left:none}
.he-table td:first-child{width:220px;min-width:220px;max-width:220px}
.he-table td:first-child>div{display:flex;gap:6px;align-items:center}
.he-table td:first-child select{width:105px;min-width:105px;max-width:105px;flex-shrink:0}
.he-table td:first-child .sb{width:80px;min-width:80px;max-width:80px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-sizing:border-box;flex-shrink:0;font-size:.68rem;padding:3px 4px}

.he-table th:nth-child(7),.he-table td:nth-child(7){border-left:2px solid var(--bg4)}
.he-table tr[data-et="Workflow"] td:nth-child(2){padding-left:12px}
.he-table tr[data-et="User/System Workflow"] td:nth-child(2){padding-left:24px}
.he-table tr[data-et="Application"] td:nth-child(2){padding-left:36px}
.he-table tr[data-et="Platform"] td:nth-child(2){padding-left:48px}
.he-table tr[data-et="Workflow"]{background:rgba(78,205,196,.06)}
.he-table tr[data-et="User/System Workflow"]{background:rgba(100,149,237,.06)}
.he-table tr[data-et="Workflow"] td:nth-child(2) input{font-weight:700}
.he-table tr[data-et="User/System Workflow"] td:nth-child(2) input{font-weight:600}
.cell-muted{color:var(--text3);opacity:.65}
.fm-link{padding:2px 8px;border-radius:8px;font-size:.7rem;font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
.fm-link-moderate{background:rgba(255,212,59,.15);color:var(--yellow)}
.fm-link-high{background:rgba(255,169,77,.15);color:var(--orange)}
.fm-link-critical{background:rgba(255,107,107,.15);color:var(--red)}
.fm-link-low{background:rgba(81,207,102,.15);color:var(--green)}
.he-table.hide-wf-col th:nth-child(3),.he-table.hide-wf-col td:nth-child(3){display:none}
.row-entity{display:flex;align-items:center;gap:6px}

.step-pending .ck{border-color:var(--orange)!important;font-size:.85rem}
.steps-checklist li .ck{border:none;font-size:.85rem}
.steps-checklist li{cursor:default}
.amber-row td{background:rgba(255,169,77,.08)!important}
.review-warning{background:rgba(255,169,77,.12);color:var(--orange);padding:12px 16px!important;font-size:.82rem;line-height:1.6;border-left:3px solid var(--orange)}
.rpv-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}

.rpv-card .scale-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:10px;font-size:.82rem;color:var(--text2)}

tr.row-inferred{border-left:3px solid var(--purple)}

    <button class="btn btn-secondary btn-sm" onclick="BlockImport.showImportUI()" title="Import from data flow diagram image">📊 Import Data Flows</button>

<main class="main" id="mc"></main>
<div class="modal-overlay" id="modal-o"><div class="modal" id="modal-c"></div></div>
<script>
const SK='fma_framework_v2';
const PH=[
  {id:'intro',n:'Overview',ic:'📋'},
  {id:'p1',n:'Failure Mode Analysis',ic:'🔍'},
  {id:'p2',n:'Mitigation & Validation',ic:'🛡️'},
  {id:'p3',n:'Health Model',ic:'🗺️'},
  {id:'p4',n:'Operations & Governance',ic:'🏛️'},
  {id:'in',n:'Insights',ic:'📊'}
];

const P3Q=[
  {id:'im',t:'Overall business impact: 1=None, 2=Minor, 3=Moderate, 4=Major, 5=Catastrophic',c:'Impact'},
  {id:'li',t:'Probability of occurrence: 1=Rare, 2=Unlikely, 3=Possible, 4=Likely, 5=Frequent',c:'Likelihood'},
  {id:'de',t:'How hard to detect: 1=Easy, 2=Good, 3=Moderate, 4=Hard, 5=Impossible',c:'Detectability'}
];

const STEPS=[
  [],
  ['Add workflows to the workflow manager bar','Add failure modes for each Application and Platform component','Score Impact, Likelihood, Detectability (1–5), enter Outage Type Score, and review auto-calculated RPV and Risk Level'],
  ['Define Detection, Client Fix, Infra Fix, and Recovery for each failure mode','Use Auto-Fill to populate from Azure best practices, then review and adjust','Define chaos test scenarios — what to inject and what should happen'],
  ['Import workflows from Phase 1 and components from Phase 1','Organize entities: Workflow → User/System Workflow → App Comp → Platform','Import failure modes as signal candidates from Phase 1','Review and refine suggested signals and thresholds','Add manual signals for any additional monitoring needs','Review FMA coverage — aim for Strong Alignment (≥80%)'],
  ['Monitor workflow health continuously','Track open alerts, dependency alignment, auto-mitigation status','Run scheduled review cycles per Governance Model','Review artifacts and record outcomes','Apply updates to thresholds, dependencies, mitigations'],
  ['View aggregated FMA and health model summary','Analyze risk distribution across workflows and components','Review coverage metrics and signal alignment','Export insights report for stakeholder review']
];

function ds(){
  return {cp:0,pc:[false,false,false,false,false,false],sc:[[],[],[],[],[],[]],wn:'',
    p1:{wf:[]},p2:{fm:[]},p3:{mt:[],ct:[],vr:[]},p4:{he:[],pr:[]},p5:{md:[],gv:[]}};
}
let S;
let _wfTab={1:null,2:null,3:null,4:null};
try{const r=localStorage.getItem(SK);S=r?JSON.parse(r):ds();}catch(e){S=ds();}
// Ensure all keys exist (forward compat)
const _d=ds();for(const k in _d){if(!(k in S))S[k]=_d[k];}

// Migration from V2 to V3: Merge old Phase 2 data into Phase 1
function migrateV2toV3(){
  if(!S.p2 || (!S.p2.uf && !S.p2.sf)) return;
  if(S.p2.uf && Array.isArray(S.p2.uf) && S.p2.uf.length>0){
    // Old format detected - merge
    [...(S.p2.uf||[]), ...(S.p2.sf||[])].forEach(f=>{
      const w = S.p1.wf.find(w=> w.id===f.sid || w.nm===f.nm);
      if(w){
        w.imp=f.imp; w.lik=f.lik; w.det=f.det;
        w.rpv=f.rpv; w.rl=f.rl; w.fo=f.fo;
        for(let i=1;i<=5;i++) if(f['cq'+i]) w['cq'+i]=f['cq'+i];
      }
    });

    // Shift all downstream phases and merge P4 into P3
    if(S.p4 && (S.p4.ct || S.p4.vr)){
      // Merge old P4 ct/vr into P3
      if(!S.p3.ct) S.p3.ct = S.p4.ct || [];
      if(!S.p3.vr) S.p3.vr = S.p4.vr || [];
    }
    S.p6=S.p7||{md:[],gv:[]};
    S.p5=S.p6||{hs:[],pr:[]};
    S.p4=S.p5||{hm:[]};
    // p3 already merged with old p4 above
    S.p2=S.p3||{fm:[]};
    delete S.p7;
    delete S.p8;
    // Update pc and sc arrays to 6+1 phases
    if(S.pc && S.pc.length===8) {S.pc.splice(4,1);S.pc.pop();}
    if(S.sc && S.sc.length===8) {S.sc.splice(4,1);S.sc.pop();}
    sv();
  }
}
function migrateP4P5(){
  if(S.p4 && S.p4.he) return;
  const entities=[];
  (S.p4&&S.p4.hm?S.p4.hm:[]).forEach(h=>{
    entities.push({
      id:uid(),_src:h._src||'manual',et:'Workflow',en:h.wf,pa:'',wf:h.wf,
      mn:'',th:'',cv:'',hs:'Unknown',tr:'',at:'',
      ui:h.ui||0,bi:h.bi||0,ac:0,pd:0,ws:h.ws||0,vs:h.vs||'',nt:''
    });
    if(h.bf) entities.push({
      id:uid(),_src:'inferred',et:'User/System Workflow',en:h.bf,pa:h.wf,wf:h.wf,
      mn:'',th:'',cv:'',hs:'Unknown',tr:'',at:'',
      ui:h.bi||0,bi:0,ac:0,pd:0,ws:0,vs:'',nt:''
    });
    if(h.ap) h.ap.split(',').map(s=>s.trim()).filter(Boolean).forEach(a=>{
      entities.push({
        id:uid(),_src:'inferred',et:'Application',en:a,pa:h.bf||h.wf,wf:h.wf,
        mn:'',th:'',cv:'',hs:'Unknown',tr:'',at:'',
        ui:h.ac||0,bi:0,ac:0,pd:0,ws:0,vs:'',nt:''
      });
    });
    if(h.pp) h.pp.split(',').map(s=>s.trim()).filter(Boolean).forEach(p=>{
      entities.push({
        id:uid(),_src:'inferred',et:'Platform',en:p,pa:h.bf||h.wf,wf:h.wf,
        mn:'',th:'',cv:'',hs:'Unknown',tr:'',at:'',
        ui:h.pd||0,bi:0,ac:0,pd:0,ws:0,vs:'',nt:''
      });
    });
  });
  (S.p5&&S.p5.hs?S.p5.hs:[]).forEach(s=>{
    const entity=entities.find(e=>e.en===s.cn&&(
      (s.ct==='Application'&&e.et==='Application')||
      (s.ct==='Platform'&&e.et==='Platform')
    ));
    if(entity&&s.mn){
      entities.push({
        ...entity,id:uid(),mn:s.mn,th:s.th,cv:s.cv,
        hs:s.st||'Unknown',tr:s.tr,at:s.at,nt:s.nt
      });
    }
  });
  const hasSignal=new Set();
  entities.forEach(e=>{
    if(e.mn&&(e.et==='Application'||e.et==='Platform')){
      hasSignal.add([e.et,e.en,e.pa,e.wf].join('|'));
    }
  });
  const deduped=entities.filter(e=>{
    if(e.mn) return true;
    if(e.et==='Application'||e.et==='Platform'){
      return !hasSignal.has([e.et,e.en,e.pa,e.wf].join('|'));
    }
    return true;
  });
  S.p4={he:deduped,pr:(S.p5&&S.p5.pr)?S.p5.pr:[]};
  if(S.p6&&(S.p6.md||S.p6.gv)) S.p5=S.p6;
  else if(!S.p5||S.p5.hs) S.p5={md:[],gv:[]};
  delete S.p6;
  if(S.pc&&S.pc.length===7) S.pc.splice(5,1);
  if(S.sc&&S.sc.length===7) S.sc.splice(5,1);
  if(S.pc&&S.pc.length>6) S.pc=S.pc.slice(0,6);
  if(S.sc&&S.sc.length>6) S.sc=S.sc.slice(0,6);
  while(S.pc&&S.pc.length<6) S.pc.push(false);
  while(S.sc&&S.sc.length<6) S.sc.push([]);
  if(S.cp>5) S.cp=5;
  sv();
}
migrateV2toV3();
migrateP4P5();
// Migration: 6-element pc/sc arrays → 5-element (drop old Phase 1 index)
if(S.pc&&S.pc.length===6){S.pc=[S.pc[0],S.pc[2],S.pc[3],S.pc[4],S.pc[5]];}
if(S.sc&&S.sc.length===6){S.sc=[S.sc[0],S.sc[2],S.sc[3],S.sc[4],S.sc[5]];}
if(S.cp>4) S.cp=4;
if(!S.p1)S.p1={wf:[]};if(!S.p1.wf)S.p1.wf=[];
if(!S.p2)S.p2={fm:[]};if(!S.p2.fm)S.p2.fm=[];
if(!S.p3)S.p3={mt:[],ct:[],vr:[]};if(!S.p3.mt)S.p3.mt=[];if(!S.p3.ct)S.p3.ct=[];if(!S.p3.vr)S.p3.vr=[];
if(!S.p4)S.p4={he:[],pr:[]};if(!S.p4.he)S.p4.he=[];if(!S.p4.pr)S.p4.pr=[];
if(!S.p5.ae)S.p5.ae=[];if(!S.p5.sl)S.p5.sl=[];
if(!S.pc)S.pc=[false,false,false,false,false];
// One-time migration: Q1-Q10 → direct scores (im/li/de)
(S.p2 && S.p2.fm || []).forEach(function(fm) {
  if (fm.q1 !== undefined && fm.im === undefined) {
    var avg = function(keys) {
      var vs = keys.map(function(k) { return fm[k] || 0; }).filter(function(v) { return v > 0; });
      return vs.length ? Math.round(vs.reduce(function(a, b) { return a + b; }, 0) / vs.length) : 0;
    };
    fm.im = avg(['q1', 'q2', 'q3', 'q4']);
    fm.li = avg(['q5', 'q6', 'q7']);
    fm.de = avg(['q8', 'q9', 'q10']);
  }
});
function sv(){localStorage.setItem(SK,JSON.stringify(S));}
// One-time backfill: assign parents for existing entities using dependency graph
// Also migrates pa → connections for backward compatibility
(function backfillParents() {
  if (!S.p4 || !S.p4.he || !S.p4.he.length) return;
  var calledBy = window._hmCalledBy || {};
  var changed = false;
  S.p4.he.forEach(function(e) {
    // Migrate: if entity has pa but no connections, create connections from pa
    if (e.pa && !e.connections) {
      e.connections = [e.pa];
      changed = true;
    }
    if (!e.connections) e.connections = [];
    if (e.et === 'Signal' || e.et === 'Workflow' || e.et === 'User/System Workflow') return;
    var wf = e.wf;
    if (!wf) return;
    // Validate Platform.pa points to an Application (not to a Workflow-layer entity).
    // Corrupted data (e.g. from migrateP4P5 where pa=h.bf which == bfName == USW.en)
    // would cause Platform to connect directly to User/System Workflow in the tree.
    if (e.et === 'Platform' && e.pa) {
      var paIsApp = S.p4.he.find(function(p) { return p.et === 'Application' && p.en === e.pa && p.wf === wf; });
      if (paIsApp) return; // pa is already pointing to a valid Application — skip
      // pa points to wrong layer — clear it so the calledBy logic below can re-assign
      e.pa = '';
      e.connections = [];
      changed = true;
    } else if (e.pa) {
      return; // Application or other type with a pa set — skip re-assignment
    }

    if (e.et === 'Application') {
      var bf = S.p4.he.find(function(p) { return p.et === 'User/System Workflow' && p.wf === wf; });
      if (bf) { e.pa = bf.en; e.connections = [bf.en]; changed = true; }
    } else if (e.et === 'Platform') {
      var platCallers = (calledBy[e.en] || []);
      var callerApp = null;
      for (var j = 0; j < platCallers.length; j++) {
        callerApp = S.p4.he.find(function(p) {
          return p.et === 'Application' && p.en === platCallers[j] && p.wf === wf;
        });
        if (callerApp) break;
      }

// === calculations ===

function calcFM(fm){
  var o=fm.os||0;
  if(o===0){fm.rpv=0;fm.rl='Not a Risk';return;}
  fm.rpv=(fm.im||0)*(fm.li||0)*(fm.de||0)*o;
  fm.rl=fm.rpv>=100?'Critical':fm.rpv>=50?'High':fm.rpv>=30?'Moderate':'Low';
}

function calcP4(entities){
  if(!Array.isArray(entities)) return;
  entities.forEach(e=>{
    if(e.et==='Workflow') e.wf=e.en||e.wf||'';
    else {
      var conns=e.connections||(e.pa?[e.pa]:[]);
      var firstConn=conns[0]||'';
      if(firstConn){
        const p=entities.find(r=>r.en===firstConn&&r.wf===e.wf);
        if(p) e.wf=p.wf||p.en||e.wf;
        else if(!e.wf){const p2=entities.find(r=>r.en===firstConn);if(p2) e.wf=p2.wf||p2.en||'';}
      }
    }
  });
  const shared=new Map();
  entities.forEach(e=>{
    if(!e.en||!e.mn) return;
    const key=`${e.en}|${e.mn}`;
    const prev=shared.get(key)||{};
    const next={...prev};
    ['th'].forEach(f=>{if(e[f]) next[f]=e[f];});
    shared.set(key,next);
  });
  entities.forEach(e=>{
    if(!e.en||!e.mn) return;
    const key=`${e.en}|${e.mn}`;
    const vals=shared.get(key);
    if(vals) ['th'].forEach(f=>{if(vals[f]) e[f]=vals[f];});
  });
  // Coverage counts Signal sub-rows with fmId, not entity rows
  entities.filter(e=>e.et==='Workflow').forEach(w=>{
    const wfName=w.en;
    const fmForWorkflow=S.p2.fm.filter(f=>f.wf===wfName&&f.fn&&f.cn&&f.rl&&f.rl!=='Not a Risk');
    const totalFM=fmForWorkflow.length;
    const coveredFM=fmForWorkflow.filter(f=>{const fmId=f.cn+'|'+f.fn;return entities.some(e=>e.et==='Signal'&&e.wf===wfName&&e.fmId===fmId&&e.mn);}).length;
    const coverage=totalFM>0?Math.round((coveredFM/totalFM)*100):0;
    w.ws=coverage;
    if(coverage>=80) w.vs='Strong Alignment';
    else if(coverage>=50) w.vs='Moderate Alignment';
    else w.vs='Weak Alignment';
    w._fmTotal=totalFM;
    w._fmCovered=coveredFM;
  });
}

function RC(focusId){

function wfMatch(val,wfName){
  if(!val)return false;
  if(val.includes(','))return val.split(',').map(w=>w.trim()).includes(wfName);
  if(val.includes('|'))return val.split('|').map(w=>w.trim()).includes(wfName);
  return val===wfName;
}

function computeSteps(pi){
  const activeWf=_wfTab[pi]||'__all__';
  const fWf=activeWf!=='__all__';
  const wm=v=>!fWf||wfMatch(v,activeWf);
  const wf=S.p1.wf;
  const fm=fWf?S.p2.fm.filter(f=>wm(f.wf)):S.p2.fm;
  const mt=fWf?S.p3.mt.filter(m=>wm(m.wi||m.wf)):S.p3.mt;
  const ct=fWf?S.p3.ct.filter(t=>wm(t.wf)):S.p3.ct;
  const vr=fWf?S.p3.vr.filter(v=>wm(v.wf)):S.p3.vr;
  const he=fWf?S.p4.he.filter(e=>wm(e.wf)):S.p4.he;
  const pr=S.p4.pr,md=fWf?S.p5.md.filter(m=>wm(m.wf)):S.p5.md,gv=S.p5.gv;
  const allAns=w=>w.ft&&w.imp&&w.lik&&w.det;
  switch(pi){
    case 1:return[
      S.p1.wf.length>0,
      fm.length>0,
      fm.length>0&&fm.every(f=>f.im>0&&f.li>0&&f.de>0&&f.os!=null)
    ];
    case 2:{
      // Use groupP3ByComponent to get exact same fm→mt pairs as the Mitigated table
      const grpWf=fWf?activeWf:null;
      const grpEntries=grpWf?groupP3ByComponent(grpWf).flatMap(g=>g.fms):[];
      const allMitigated=grpEntries.length>0&&grpEntries.every(e=>e.mt.dm&&e.mt.cm&&e.mt.im&&e.mt.rp);
      return[
        mt.length>0&&mt.some(m=>m.dm||m.cm||m.im||m.rp),
        allMitigated,
        ct.length>0&&ct.some(t=>t.ts||t.it||t.eb)
      ];
    }
    case 3:{
      const wfs=he.filter(e=>e.et==='Workflow');
      const leaves=he.filter(e=>e.et==='Application'||e.et==='Platform');
      const leafNames=new Set(leaves.map(e=>e.en));
      const allHe=S.p4.he;
      const leafSignals=allHe.filter(e=>e.et==='Signal'&&leafNames.has(e.en));
      return[
        wfs.length>0&&leaves.length>0,
        he.length>0&&he.every(e=>e.et&&e.en),
        he.some(e=>e.fmId),
        // Each leaf must have a signal scoped to its own workflow — prevents cross-wf false pass
        leaves.length>0&&leaves.every(l=>allHe.some(s=>s.et==='Signal'&&s.en===l.en&&(l.wf?s.wf===l.wf:true)&&s.mn&&s.th)),
        leafSignals.some(e=>e.mn&&!e.fmId)||wfs.some(w=>(w.ws||0)>=80),
        wfs.length>0&&wfs.some(w=>(w.ws||0)>=80)
      ];
    }
    case 4:return[
      gv.length>0,
      gv.length>0&&gv.some(g=>g.ow),
      gv.length>0&&gv.some(g=>g.fr),
      gv.length>0&&gv.some(g=>g.af||g.op)
    ];
    default:return[];
  }
}

var _fmExpanded = {};

function groupFMsByComponent(fms) {
  var groups = {};
  fms.forEach(function(f) {
    var key = (f.ct || '') + '|' + (f.cn || '');
    if (!groups[key]) {
      groups[key] = { ct: f.ct, cn: f.cn, fms: [], _src: f._src };
    }
    groups[key].fms.push(f);
  });
  var sorted = Object.values(groups).sort(function(a, b) {
    var ctA = (a.ct || '').toLowerCase(), ctB = (b.ct || '').toLowerCase();
    if (ctA < ctB) return -1; if (ctA > ctB) return 1;
    var cnA = (a.cn || '').toLowerCase(), cnB = (b.cn || '').toLowerCase();
    if (cnA < cnB) return -1; if (cnA > cnB) return 1;
    return 0;
  });
  return sorted;
}

function groupStats(fms) {
  var rpvs = fms.map(function(f) { return f.rpv || 0; });
  var maxRPV = Math.max.apply(null, rpvs);
  var avgRPV = Math.round(rpvs.reduce(function(a, b) { return a + b; }, 0) / rpvs.length);
  var maxOutage = Math.max.apply(null, fms.map(function(f) { return f.os || 0; }));
  var worst = fms.reduce(function(a, b) { return (b.rpv || 0) > (a.rpv || 0) ? b : a; });
  return { count: fms.length, maxRPV: maxRPV, avgRPV: avgRPV, maxOutage: maxOutage, worstRL: worst.rl || '—' };
}

function outageIndicator(maxOutage) {
  if (maxOutage >= 2) return '<span style="color:var(--red)">🔴 2</span>';
  if (maxOutage >= 1) return '<span style="color:var(--yellow)">🟡 1</span>';
  return '<span style="color:var(--text3)">⚪ 0</span>';
}

function groupP3ByComponent(wfName){
  const fms=S.p2.fm.filter(f=>f.wf===wfName&&f.fn&&f.cn);
  const mts=S.p3.mt.filter(m=>(m.wi||m.wf||'')===wfName||(m.wi||'').split(',').map(w=>w.trim()).includes(wfName));
  const vrs=S.p3.vr.filter(v=>v.wf===wfName);
  const cts=S.p3.ct.filter(t=>t.wf===wfName);
  const groups={};
  fms.forEach(f=>{
    if(!groups[f.cn])groups[f.cn]={cn:f.cn,ct:f.ct,fms:[]};
    let mt=mts.find(m=>m.fm===f.fn&&(m.sc||'').trim().toLowerCase()===(f.cn||'').trim().toLowerCase())||mts.find(m=>m.fm===f.fn)||{};
    let vr=vrs.find(v=>v.fm===f.fn&&(v.co||'').trim().toLowerCase()===(f.cn||'').trim().toLowerCase())||vrs.find(v=>v.fm===f.fn)||{};
    let ct=cts.find(t=>t.fm===f.fn&&((t.tc||'').trim().toLowerCase()===(f.cn||'').trim().toLowerCase()||!t.tc))||cts.find(t=>t.fm===f.fn)||{};
    if(!mt.id&&f.fn){mt={id:uid(),_src:'auto',sc:f.cn||'',fm:f.fn,wi:wfName,dc:'',ci:f.rl||'',cm:'',im:'',dm:'',rp:'',is:'Not Started',ow:'',wf:wfName};S.p3.mt.push(mt);}
    if(!vr.id&&f.fn){vr={id:uid(),_src:'auto',fm:f.fn,co:f.cn||'',rl:f.rl||'',te:'',va:'',da:'',me:'',rs:'',st:'',ir:'',wf:wfName};S.p3.vr.push(vr);}
    if(!ct.id&&f.fn){ct={id:uid(),_src:'auto',fm:f.fn,ts:'',it:'',tc:f.cn||'',eb:'',ab:'',rt:'',pl:'',re:'',dv:'',ob:'',to:'',wf:wfName};S.p3.ct.push(ct);}
    groups[f.cn].fms.push({fm:f,mt:mt,vr:vr,ct:ct});
  });
  return Object.values(groups).sort((a,b)=>{
    const maxA=Math.max(...a.fms.map(f=>f.fm.rpv||0));
    const maxB=Math.max(...b.fms.map(f=>f.fm.rpv||0));
    return maxB-maxA;
  });
}

// ===== Bicep Export for Azure Health Model =====
function sanitizeForBicep(name){
  var s=(name||'').replace(/[^a-zA-Z0-9]/g,'-').replace(/-{2,}/g,'-').replace(/^-+|-+$/g,'').toLowerCase();
  s=s.replace(/^[^a-z]+/,'');
  if(s.length>44) s=s.slice(0,44).replace(/-+$/,'');
  if(s.length<3) s=(s+'aaa').slice(0,3);
  if(!/[a-z0-9]$/.test(s)) s=s.replace(/-+$/,'')+'a';
  return s||'unnamed';
}

function escapeBicepDisplayName(str){
  return (str||'').replace(/'/g,"\\'");
}

function _parseThresholdForBicep(th){
  if(!th) return null;
  var m=th.match(/^(>=?|<=?|!=|=)\s*([\d.]+)/);
  if(!m) return null;
  // Invert: threshold describes HEALTHY state, unhealthyRule needs the VIOLATED condition
  var ops={'>':'LessThanOrEqual','>=':'LessThan','<':'GreaterThanOrEqual','<=':'GreaterThan','=':'NotEqual','!=':'Equal'};
  return ops[m[1]]?{operator:ops[m[1]],threshold:parseFloat(m[2])}:null;
}

function _collectEntitySignals(entityName,wfFilter){
  var sigs=S.p4.he.filter(function(e){
    return e.et==='Signal'&&e.en===entityName&&e.mn;
  });
  if(wfFilter) sigs=sigs.filter(function(e){return e.wf===wfFilter;});
  var seen={},out=[];
  sigs.forEach(function(s){
    var key=(s.mn||'')+'|'+(s.fmId||'');
    if(!seen[key]){seen[key]=true;out.push(s);}
  });
  return out;
}

function generateBicep(wfName){
  var modelName=(S.wn||'healthmodel').replace(/[^a-zA-Z0-9]/g,'').toLowerCase()||'hm01';
  var location='canadacentral';
  var entities=S.p4.he.filter(function(e){return e.et!=='Signal';});
  if(wfName){
    entities=entities.filter(function(e){
      if(e.et==='Workflow') return e.en===wfName||e.wf===wfName;
      return e.wf===wfName;
    });
  }
  var unique=_dedupSwimlane(entities);

  // Build dagre graph for canvas positions
  var g=new dagre.graphlib.Graph();
  g.setGraph({rankdir:'TB',ranksep:80,nodesep:24});
  g.setDefaultEdgeLabel(function(){return {};});
  unique.forEach(function(e){
    g.setNode(e.id,{width:220,height:56});
  });
  unique.forEach(function(e){
    var conns=e.connections||(e.pa?[e.pa]:[]);
    conns.forEach(function(targetName){
      var target=unique.find(function(p){return p.en===targetName;});
      if(target) g.setEdge(e.id,target.id);
    });
  });
  if(typeof dagre!=='undefined') dagre.layout(g);

  var platformEntities=unique.filter(function(e){return e.et==='Platform';});

  var b='';
  // Parameters
  b+="param healthmodel_name string = '"+modelName+"'\n";
  b+="param location string = '"+location+"'\n";
  b+="param log_analytics_workspace_id string = '' // Log Analytics workspace resource ID for Application entity signals\n";
  platformEntities.forEach(function(e){
    var paramName=sanitizeForBicep(e.en).replace(/-/g,'_')+'_externalid';
    b+="param "+paramName+" string = '' // Azure resource ID for "+e.en+"\n";
  });
  b+='\n';

  // Root health model resource
  b+="resource healthmodel 'Microsoft.CloudHealth/healthmodels@2026-01-01-preview' = {\n";
  b+="  name: healthmodel_name\n";
  b+="  location: location\n";
  b+="  identity: {\n";
  b+="    type: 'SystemAssigned'\n";
  b+="  }\n";
  b+="  properties: {}\n";
  b+="}\n\n";

  // Authentication settings
  b+="resource auth 'microsoft.cloudhealth/healthmodels/authenticationsettings@2026-01-01-preview' = {\n";
  b+="  parent: healthmodel\n";
  b+="  name: 'systemassigned'\n";
  b+="  properties: {\n";
  b+="    authenticationKind: 'ManagedIdentity'\n";
  b+="    managedIdentityName: 'SystemAssigned'\n";
  b+="    displayName: 'SystemAssigned'\n";
  b+="  }\n";
  b+="}\n\n";

  // Entity resources
  var entityResNames={};
  // Bug 3 fix: detect duplicate symbolic names and add type prefix
  var resNameCounts={};
  unique.forEach(function(e){
    var base='entity_'+sanitizeForBicep(e.en).replace(/-/g,'_');
    resNameCounts[base]=(resNameCounts[base]||0)+1;
  });
  var typePrefixes={'Workflow':'wf_','User/System Workflow':'usf_','Application':'app_','Platform':'plat_'};
  unique.forEach(function(e,idx){
    var entityName=sanitizeForBicep(e.en);
    var base='entity_'+entityName.replace(/-/g,'_');
    var resName=base;
    if(resNameCounts[base]>1){
      resName='entity_'+(typePrefixes[e.et]||'')+entityName.replace(/-/g,'_');
    }
    entityResNames[e.id]=resName;

    var node=(typeof dagre!=='undefined'&&g.node(e.id))?g.node(e.id):null;
    var x=node?Math.round(node.x):(idx*250);
    var y=node?Math.round(node.y):(idx*150);

    var iconName=e.et==='Workflow'?'HealthModel':
                 e.et==='User/System Workflow'?'UserFlow':
                 e.et==='Platform'?'Resource':'Component';

    var crit=getComponentCriticality(e.en);
    var impact=crit.rpv>=100?'Limited':'Standard';

    b+="resource "+resName+" 'microsoft.cloudhealth/healthmodels/entities@2026-01-01-preview' = {\n";
    b+="  parent: healthmodel\n";
    b+="  name: '"+entityName+"'\n";
    b+="  properties: {\n";
    b+="    displayName: '"+escapeBicepDisplayName(e.en)+"'\n";
    b+="    canvasPosition: {\n";
    b+="      x: json('"+x+"')\n";
    b+="      y: json('"+y+"')\n";
    b+="    }\n";
    b+="    icon: {\n";
    b+="      iconName: '"+iconName+"'\n";
    b+="    }\n";
    b+="    impact: '"+impact+"'\n";
    b+="    tags: {}\n";

    var entitySigs=_collectEntitySignals(e.en,wfName);
    // Bug 1 fix: deduplicate signal names within an entity
    var sigNameCounts={};
    entitySigs.forEach(function(sig){sigNameCounts[sanitizeForBicep(sig.mn)]=(sigNameCounts[sanitizeForBicep(sig.mn)]||0)+1;});
    var sigNameUsed={};

    if(e.et==='Platform'){
      var paramName=sanitizeForBicep(e.en).replace(/-/g,'_')+'_externalid';
      b+="    signalGroups: !empty("+paramName+") ? {\n";
      b+="      azureResource: {\n";
      b+="        authenticationSetting: 'systemassigned'\n";
      b+="        azureResourceId: "+paramName+"\n";
      if(entitySigs.length){
        b+="        signals: [\n";
        entitySigs.forEach(function(sig){
          var baseName=sanitizeForBicep(sig.mn);
          var sigName=baseName;
          if(sigNameCounts[baseName]>1){
            sigNameUsed[baseName]=(sigNameUsed[baseName]||1);
            if(sigNameUsed[baseName]>1) sigName=baseName+'-'+sigNameUsed[baseName];
            sigNameUsed[baseName]++;
          }
          b+="          {\n";
          b+="            name: '"+sigName+"'\n";
          b+="            displayName: '"+escapeBicepDisplayName(sig.mn)+"'\n";
          b+="            signalKind: 'AzureResourceMetric'\n";
          b+="            metricName: '"+baseName+"' // TODO: verify Azure Monitor metric name\n";
          var parsed=_parseThresholdForBicep(sig.th);
          if(parsed){
            b+="            evaluationRules: {\n";
            b+="              unhealthyRule: {\n";
            b+="                operator: '"+parsed.operator+"'\n";
            b+="                threshold: json('"+parsed.threshold+"')\n";
            b+="              }\n";
            b+="            }\n";
          }
          if(sig.fmName) b+="            // Linked FM: "+sig.fmName+"\n";
          b+="          }\n";
        });
        b+="        ]\n";
      }
      b+="      }\n";
      b+="    } : {}\n";
    } else if(e.et==='Application'&&entitySigs.length){
      // Log Analytics signal groups for Application entities
      b+="    signalGroups: !empty(log_analytics_workspace_id) ? {\n";
      b+="      azureLogAnalytics: {\n";
      b+="        authenticationSetting: 'systemassigned'\n";
      b+="        logAnalyticsWorkspaceResourceId: log_analytics_workspace_id\n";
      b+="        signals: [\n";
      entitySigs.forEach(function(sig){
        var baseName=sanitizeForBicep(sig.mn);
        var sigName=baseName;
        if(sigNameCounts[baseName]>1){
          sigNameUsed[baseName]=(sigNameUsed[baseName]||1);
          if(sigNameUsed[baseName]>1) sigName=baseName+'-'+sigNameUsed[baseName];
          sigNameUsed[baseName]++;
        }
        b+="          {\n";
        b+="            name: '"+sigName+"'\n";
        b+="            displayName: '"+escapeBicepDisplayName(sig.mn)+"'\n";
        b+="            signalKind: 'LogAnalyticsQuery'\n";
        b+="            queryText: '// TODO: Add KQL query for: "+escapeBicepDisplayName(sig.mn)+(sig.th?' ['+sig.th+']':'')+"\\n// Example: AppMetrics | where Name == \""+escapeBicepDisplayName(sig.mn)+"\" | summarize avg(Value) by bin(TimeGenerated, 5m)'\n";
        var parsed=_parseThresholdForBicep(sig.th);
        if(parsed){
          b+="            evaluationRules: {\n";
          b+="              unhealthyRule: {\n";
          b+="                operator: '"+parsed.operator+"'\n";
          b+="                threshold: json('"+parsed.threshold+"')\n";
          b+="              }\n";
          b+="            }\n";
        } else {
          b+="            evaluationRules: {\n";
          b+="              unhealthyRule: {\n";
          b+="                operator: 'NotEqual'\n";
          b+="                threshold: json('1')\n";
          b+="              }\n";
          b+="            }\n";
        }
        if(sig.fmName) b+="            // Linked FM: "+sig.fmName+"\n";
        b+="          }\n";
      });
      b+="        ]\n";
      b+="      }\n";
      b+="    } : {}\n";
      b+="    // Health Signals (configure in Azure portal after deployment):\n";
      entitySigs.forEach(function(sig){
        b+="    //   - "+sig.mn+(sig.th?' ['+sig.th+']':'')+(sig.fmName?' (FM: '+sig.fmName+')':'')+"\n";
      });
    } else if(entitySigs.length){
      b+="    // Health Signals (configure in Azure portal after deployment):\n";
      entitySigs.forEach(function(sig){
        b+="    //   - "+sig.mn+(sig.th?' ['+sig.th+']':'')+(sig.fmName?' (FM: '+sig.fmName+')':'')+"\n";
      });
    }

    b+="  }\n";
    b+="}\n\n";
  });

  // Relationship resources
  var relIdx=0;

  // Root → top-level entities (no parent, not Workflow type)
  unique.filter(function(e){return !e.pa&&e.et!=='Workflow';}).forEach(function(e){
    var relName='rel_'+relIdx++;
    var childResName=entityResNames[e.id]||('entity_'+sanitizeForBicep(e.en).replace(/-/g,'_'));
    b+="resource "+relName+" 'microsoft.cloudhealth/healthmodels/relationships@2026-01-01-preview' = {\n";
    b+="  parent: healthmodel\n";
    b+="  name: '"+modelName+'-'+sanitizeForBicep(e.en)+"'\n";
    b+="  dependsOn: [\n";
    b+="    "+childResName+"\n";
    b+="  ]\n";
    b+="  properties: {\n";
    b+="    parentEntityName: '"+modelName+"'\n";
    b+="    childEntityName: '"+sanitizeForBicep(e.en)+"'\n";
    b+="  }\n";
    b+="}\n\n";
  });

  // Entity → entity relationships
  unique.forEach(function(e){
    var conns=e.connections||(e.pa?[e.pa]:[]);
    conns.forEach(function(parentName){
      var parent=unique.find(function(p){return p.en===parentName;});
      if(!parent) return;
      var relName='rel_'+relIdx++;
      var parentResName=entityResNames[parent.id]||('entity_'+sanitizeForBicep(parent.en).replace(/-/g,'_'));
      var childResName=entityResNames[e.id]||('entity_'+sanitizeForBicep(e.en).replace(/-/g,'_'));
      b+="resource "+relName+" 'microsoft.cloudhealth/healthmodels/relationships@2026-01-01-preview' = {\n";
      b+="  parent: healthmodel\n";
      b+="  name: '"+sanitizeForBicep(parent.en)+'-'+sanitizeForBicep(e.en)+"'\n";
      b+="  dependsOn: [\n";
      b+="    "+parentResName+"\n";

function _inferMitigationsFallback(fm){
  return{client:'Review Needed',infra:'Review Needed',detection:'Review Needed',recovery:'Review Needed',testType:'Chaos'};
}

// Word-level fallback: try sub-phrases of the failure mode name against the map
function _inferWithFallback(failureMode){
  var infer=(typeof SeqImport!=='undefined'&&SeqImport.inferMitigations)?SeqImport.inferMitigations:_inferMitigationsFallback;
  var bp=infer(failureMode);
  if(bp.client!=='Review Needed')return bp;
  var map=(typeof SeqImport!=='undefined'&&SeqImport._constants)?SeqImport._constants.MITIGATION_MAP:null;
  if(!map)return bp;
  var words=failureMode.toLowerCase().split(/\s+/);
  // Try shrinking sub-phrases (longest first) so "connection timeout" tries 2-word, then 1-word
  for(var w=words.length-1;w>=1;w--){
    for(var s=0;s<=words.length-w;s++){
      var sub=words.slice(s,s+w).join(' ');
      if(map[sub])return map[sub];
    }
  }
  // Try if any map key is contained within the failure mode name
  var key=failureMode.toLowerCase(),best=null,bestLen=0;
  var keys=Object.keys(map);
  for(var k=0;k<keys.length;k++){
    if(key.indexOf(keys[k])>=0&&keys[k].length>bestLen){best=map[keys[k]];bestLen=keys[k].length;}
  }
  return best||bp;
}

function autoFillMitigation(failureMode,mtId,ctId){
  var bp=_inferWithFallback(failureMode);
  var genericBP={detection:'Monitor with Azure Monitor / Application Insights',client:'Implement retry logic with exponential backoff',infra:'Configure auto-scaling and health probes',recovery:'Automated failover with manual escalation path',testType:'Chaos'};
  if(!bp||bp.client==='Review Needed') bp=genericBP;
  var mt=S.p3.mt.find(function(m){return m.id===mtId;});
  if(mt){
    if(!mt.dm)mt.dm=bp.detection||'';
    if(!mt.cm)mt.cm=bp.client||'';
    if(!mt.im)mt.im=bp.infra||'';
    if(!mt.rp)mt.rp=bp.recovery||'';
  }
  var ct=S.p3.ct.find(function(t){return t.id===ctId;});
  if(ct){
    if(!ct.ts)ct.ts='Inject '+failureMode;
    if(!ct.it)ct.it=bp.testType==='Load'?'Load injection':'Fault injection';
    if(!ct.eb)ct.eb='System detects via '+(bp.detection||'monitoring').toLowerCase()+', mitigates via '+(bp.client||'retry').toLowerCase().split(',')[0];
  }
  sv();RP(2);
  SM('✅ Auto-Fill','Populated best practices for "'+failureMode+'":<br>• Detection: '+(bp.detection||'—')+'<br>• Client: '+(bp.client||'—').substring(0,60)+'<br>• Infra: '+(bp.infra||'—').substring(0,60));
}

      mtA++;

  });

  S.p2.fm.filter(f=>f.fn&&f.rl).forEach(f=>{
    if(!S.p3.vr.find(v=>v.fm===f.fn&&v.co===f.cn&&v.wf===f.wf)){

      if(!S.p3.mt.find(m=>m.fm===f.fn&&m.sc===f.cn&&m.wf===f.wf)){

function _swimlaneEntities(wfFilter){
  var entities=S.p4.he.filter(function(e){return e.et!=='Signal';});
  if(wfFilter&&wfFilter!=='__all__'){
    entities=entities.filter(function(e){
      if(e.et==='Workflow') return e.en===wfFilter||e.wf===wfFilter;
      return e.wf===wfFilter;
    });
  }
  return entities;
}

function _dedupSwimlane(arr){
  var seen={},out=[];
  arr.forEach(function(e){
    var key=e.et+'|'+e.en;
    if(!seen[key]){seen[key]=true;out.push(e);}
  });
  return out;
}

function buildTree(wfFilter) {
  var entities = _swimlaneEntities(wfFilter);
  var unique = _dedupSwimlane(entities);
  
  // 1. Create dagre graph
  var g = new dagre.graphlib.Graph();
  g.setGraph({ rankdir: 'TB', ranksep: 80, nodesep: 24, edgesep: 16, marginx: 20, marginy: 20 });
  g.setDefaultEdgeLabel(function() { return {}; });
  
  // 2. Add nodes (BizFunc, App, Platform — skip Workflow and Signal)
  var nodeW = 220, nodeH = 56;
  unique.filter(function(e) { return e.et !== 'Workflow'; }).forEach(function(e) {
    g.setNode(e.et + '|' + e.en, { label: e.en, width: nodeW, height: nodeH, entity: e });
  });
  
  // 3. Add edges from connections[] (DAG — multi-connection support)
  var layerRank = { 'Workflow': 0, 'User/System Workflow': 1, 'Application': 2, 'Platform': 3 };
  var wf = wfFilter || '__all__';
  var allEntities = _swimlaneEntities(wf);
  allEntities.filter(function(e) {
    return e.et !== 'Signal' && e.et !== 'Workflow';
  }).forEach(function(e) {
    var conns = e.connections || (e.pa ? [e.pa] : []);
    conns.forEach(function(targetName) {
      // Prefer expected parent type to avoid name collisions (e.g. workflow name === app name).
      // When expectedParent is defined, do NOT fall back to wrong-layer entities — a Platform
      // must only connect to Application, and Application only to User/System Workflow.
      var expectedParent = { 3: 'Application', 2: 'User/System Workflow' }[layerRank[e.et]];
      var target = expectedParent
        ? unique.find(function(p) { return p.en === targetName && p.et === expectedParent; })
        : unique.find(function(p) {
            return p.en === targetName && p.et !== 'Signal' && p.et !== 'Workflow';
          });
      if (target) {
        var childKey = e.et + '|' + e.en;
        var targetKey = target.et + '|' + target.en;
        if (g.hasNode(childKey) && g.hasNode(targetKey) && childKey !== targetKey) {
          var srcRank = layerRank[e.et] || 0;
          var tgtRank = layerRank[target.et] || 0;
          var sameLayer = (srcRank === tgtRank);
          if (srcRank <= tgtRank) {
            g.setEdge(childKey, targetKey, sameLayer ? { minlen: 0, weight: 0 } : {});
          } else {
            g.setEdge(targetKey, childKey, {});
          }
        }
      }
    });
  });
  
  // 4. Run dagre layout
  dagre.layout(g);
  
  // 5. Compute SVG dimensions from graph
  var graphW = g.graph().width || 600;
  var graphH = g.graph().height || 400;
  
  // 6. Build SVG string
  var svgW = graphW + 40, svgH = graphH + 40;
  var h = '<svg id="hm-tree-svg" width="100%" height="' + svgH + '" ' +
          'viewBox="0 0 ' + svgW + ' ' + svgH + '" ' +
          'preserveAspectRatio="xMidYMin meet" ' +
          'style="display:block;min-height:300px">';
  h += '<g id="hm-tree-zoom">';
  
  // No arrowheads — plain lines for DAG edges
  
  // 7. Draw edges
  g.edges().forEach(function(edgeId) {
    var edge = g.edge(edgeId);
    var points = edge.points;
    if (points && points.length >= 2) {
      var d = 'M' + points[0].x + ',' + points[0].y;
      for (var i = 1; i < points.length; i++) {
        d += ' L' + points[i].x + ',' + points[i].y;
      }
      h += '<path d="' + d + '" stroke="var(--text3)" stroke-width="2" fill="none"/>';
    }
  });
  
  // 8. Draw nodes as foreignObject (HTML inside SVG)
  g.nodes().forEach(function(nodeId) {
    var node = g.node(nodeId);
    var e = node.entity;
    var x = node.x - nodeW / 2;
    var y = node.y - nodeH / 2;
    
    var isWorkflow = (e.et === 'User/System Workflow');
    var sub, riskBadge = '';
    
    if (isWorkflow) {
      var wfCrit = getWorkflowCriticality(e.wf || e.en);
      sub = wfCrit.fmCount + ' FM'+ (wfCrit.fmCount !== 1 ? 's' : '') + ' · Max RPV ' + wfCrit.maxRPV;
      if (wfCrit.label !== 'Unknown') {
        var rc = wfCrit.label === 'Critical' ? 'sc' : wfCrit.label === 'High' ? 'sh' : wfCrit.label === 'Moderate' ? 'sm' : 'sl';
        riskBadge = ' <span class="sb ' + rc + '" style="font-size:.6rem;padding:1px 5px;vertical-align:middle">' + wfCrit.label + '</span>';
      }
    } else {
      var signals = S.p4.he.filter(function(s) {
        if (s.et !== 'Signal' || s.en !== e.en) return false;
        if (!wfFilter || wfFilter === '__all__') return true;
        return s.wf === wfFilter || s.wf === e.wf;
      });
      var sigCount = signals.length;
      var fmCount = signals.filter(function(s) { return s.fmId; }).length;
      sub = sigCount + ' sig' + (sigCount !== 1 ? 's' : '');
      if (fmCount > 0) sub += ' · ' + fmCount + ' FM' + (fmCount !== 1 ? 's' : '');
      var crit = getComponentCriticality(e.en);
      if (crit.label !== 'Unknown') {
        var rc2 = crit.label === 'Critical' ? 'sc' : crit.label === 'High' ? 'sh' : crit.label === 'Moderate' ? 'sm' : 'sl';
        riskBadge = ' <span class="sb ' + rc2 + '" style="font-size:.6rem;padding:1px 5px;vertical-align:middle">' + crit.label + '</span>';
      }
    }
    
    // Determine layer-specific CSS class
    var layerClass = '';
    if (e.et === 'Workflow' || e.et === 'User/System Workflow') {
      layerClass = ' hm-layer-workflow';
    } else if (e.et === 'Application' || e.et === 'Business Function') {
      layerClass = ' hm-layer-application';
    } else if (e.et === 'Platform') {
      layerClass = ' hm-layer-platform';
    } else if (e.et === 'Signal') {
      layerClass = ' hm-layer-signal';
    }
    
    h += '<foreignObject x="' + x + '" y="' + y + '" width="' + nodeW + '" height="' + nodeH + '">';
    h += '<div xmlns="http://www.w3.org/1999/xhtml" class="hm-tree-node' + layerClass + '" ';
    h += 'data-id="he_' + e.id + '" data-name="' + esc(e.en) + '" data-et="' + esc(e.et) + '" ';
    h += 'onclick="showNodeDetail(\'' + esc(e.en) + '\',\'' + esc(e.et) + '\')" ';
    h += 'title="' + esc(e.en) + '">';
    h += '<div class="hm-tree-body">';
    h += '<div class="hm-tree-name">' + esc(e.en) + '</div>';
    h += '<div class="hm-tree-sub">' + sub + riskBadge + '</div>';
    h += '</div>';
    h += '<button class="hm-tree-menu" onclick="event.stopPropagation();showCardMenu(\'' + e.id + '\')">⋯</button>';
    h += '</div></foreignObject>';
  });
  
  h += '</g></svg>';
  return h;
}

var _hmZoom = 1;
var _hmPanX = 0, _hmPanY = 0;
var _hmIsPanning = false, _hmPanStartX = 0, _hmPanStartY = 0;

function rebuildTree() {
  var container = document.getElementById('hm-tree-container');
  if (!container) return;
  var wf = _wfTab[3] || '__all__';
  container.innerHTML = buildTree(wf);
  requestAnimationFrame(initTreeZoom);
}

function fitTree() {
  var svg = document.getElementById('hm-tree-svg');
  var container = document.getElementById('hm-tree-container');
  if (!svg || !container) return;
  var vb = svg.getAttribute('viewBox');
  if (!vb) return;
  var parts = vb.split(/\s+/);
  var svgNativeW = parseFloat(parts[2]);
  var svgNativeH = parseFloat(parts[3]);
  if (!svgNativeW || !svgNativeH) return;
  var containerW = container.clientWidth - 16;
  var containerH = container.clientHeight || 600;
  _hmZoom = Math.min(containerW / svgNativeW, containerH / svgNativeH, 1);
  _hmPanX = (containerW - svgNativeW * _hmZoom) / 2;
  _hmPanY = 0;
  applyTreeTransform();
}

function autoLayoutTree() {
  rebuildTree();
  requestAnimationFrame(fitTree);
}

function initTreeZoom() {
  var svg = document.getElementById('hm-tree-svg');
  if (!svg) return;
  _hmZoom = 1; _hmPanX = 0; _hmPanY = 0;
  svg.addEventListener('wheel', function(ev) {
    ev.preventDefault();
    var delta = ev.deltaY > 0 ? -0.1 : 0.1;
    _hmZoom = Math.max(0.3, Math.min(3, _hmZoom + delta));
    applyTreeTransform();
  }, { passive: false });
  svg.addEventListener('mousedown', function(ev) {
    // Pan: middle-click, Ctrl+left-click, or left-click on empty space (not on a node)
    var isNode = ev.target.closest && ev.target.closest('.hm-tree-node');
    if (ev.button === 1 || (ev.button === 0 && ev.ctrlKey) || (ev.button === 0 && !isNode)) {
      ev.preventDefault();
      _hmIsPanning = true;
      _hmPanStartX = ev.clientX - _hmPanX;
      _hmPanStartY = ev.clientY - _hmPanY;
      svg.style.cursor = 'grabbing';
    }
  });
  document.addEventListener('mousemove', function(ev) {
    if (!_hmIsPanning) return;
    _hmPanX = ev.clientX - _hmPanStartX;
    _hmPanY = ev.clientY - _hmPanStartY;
    applyTreeTransform();
  });
  document.addEventListener('mouseup', function() {
    if (_hmIsPanning) {
      _hmIsPanning = false;
      var s = document.getElementById('hm-tree-svg');
      if (s) s.style.cursor = '';
    }
  });
}

function applyTreeTransform() {
  var zg = document.getElementById('hm-tree-zoom');
  if (!zg) return;
  zg.setAttribute('transform', 'translate(' + _hmPanX + ',' + _hmPanY + ') scale(' + _hmZoom.toFixed(2) + ')');
  var ind = document.getElementById('hm-zoom-level');
  if (ind) ind.textContent = Math.round(_hmZoom * 100) + '%';
}

function zoomTree(delta) {
  _hmZoom = Math.max(0.3, Math.min(3, _hmZoom + delta));
  applyTreeTransform();
}

function resetTreeZoom() {
  _hmZoom = 1; _hmPanX = 0; _hmPanY = 0;
  applyTreeTransform();
}

function renameSwimlaneEntity(entityId){
  closeHmMenu();
  var entity=S.p4.he.find(function(e){return e.id===entityId;});
  if(!entity) return;
  var newName=prompt('Rename "'+entity.en+'":',entity.en);
  if(!newName||newName===entity.en) return;
  var oldName=entity.en;
  entity.en=newName;
  if(entity._src&&entity._src!=='manual') entity._src='manual';
  S.p4.he.forEach(function(e){if(e.pa===oldName) e.pa=newName;});
  // Update connections arrays across all entities
  S.p4.he.forEach(function(e){
    if(e.connections){
      e.connections=e.connections.map(function(c){return c===oldName?newName:c;});
    }
  });
  S.p4.he.filter(function(e){return e.et==='Signal'&&e.en===oldName;}).forEach(function(e){e.en=newName;e.pa=newName;});
  if(entity.et==='Workflow') S.p4.he.forEach(function(e){if(e.wf===oldName) e.wf=newName;});
  sv();
  calcP4(S.p4.he);
  RP(3);
}

function manageConnections(entityId){
  closeHmMenu();
  var entity=S.p4.he.find(function(e){return e.id===entityId;});
  if(!entity) return;
  if(entity.et==='Workflow'||entity.et==='User/System Workflow'){
    SM('Manage Connections',entity.et==='Workflow'?'Workflows have no connections.':'User/System Workflows connect only downward automatically.');
    return;
  }
  var layerRank={'Workflow':0,'User/System Workflow':1,'Application':2,'Platform':3};
  var myRank=layerRank[entity.et]||0;
  var wf=_wfTab[3]||'__all__';
  var entities=_swimlaneEntities(wf);
  // Valid targets: any non-self entity (not Signal/Workflow), edge direction handled by buildTree
  var targets=entities.filter(function(e){
    if(e.en===entity.en&&e.et===entity.et) return false;
    if(e.et==='Signal'||e.et==='Workflow') return false;
    return true;
  });
  // Deduplicate by et|en
  var seen={},uniqueTargets=[];
  targets.forEach(function(e){
    var k=e.et+'|'+e.en;
    if(!seen[k]){seen[k]=true;uniqueTargets.push(e);}
  });
  if(!uniqueTargets.length){
    SM('Manage Connections','No valid connection targets available.');
    return;
  }
  var conns=entity.connections||(entity.pa?[entity.pa]:[]);
  // Group by entity type
  var groups={};
  uniqueTargets.forEach(function(e){
    if(!groups[e.et]) groups[e.et]=[];
    groups[e.et].push(e.en);
  });
  var html='<div style="font-size:.82rem;color:var(--text2);margin-bottom:8px">Connections for <strong>'+esc(entity.en)+'</strong> ('+esc(entity.et)+')</div>';
  html+='<div style="max-height:300px;overflow-y:auto;padding:4px 0">';
  var typeOrder=['User/System Workflow','Application','Platform'];
  typeOrder.forEach(function(et){
    if(!groups[et]) return;
    html+='<div style="font-size:.72rem;color:var(--text3);padding:6px 0 3px;border-bottom:1px solid var(--bg3);font-weight:600">── '+esc(et)+' ──</div>';
    groups[et].sort().forEach(function(name){
      var checked=conns.indexOf(name)!==-1?' checked':'';
      html+='<label style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:.82rem;cursor:pointer"><input type="checkbox" class="conn-cb" value="'+esc(name)+'"'+checked+'> '+esc(name)+'</label>';
    });
  });
  html+='</div>';
  html+='<div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-secondary btn-sm" onclick="HM()">Cancel</button><button class="btn btn-primary btn-sm" onclick="applyConnections(\''+entityId+'\')">Save</button></div>';
  SM('Manage Connections',html);
}

function applyConnections(entityId){

    <div style="display:flex;align-items:center;gap:16px;margin:12px 0">
      <div style="flex:1;height:12px;background:var(--bg4);border-radius:6px;overflow:hidden">
        <div style="width:${coverage}%;height:100%;background:${covColor};border-radius:6px"></div>
      </div>
    </div>
    <p style="font-size:.82rem;color:var(--text2)">Coverage: <strong>${coveredFMs.length}</strong> of <strong>${totalFM}</strong> failure modes have health signals</p>`;
  if(totalFM>0){
    h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px;font-size:.82rem">
      <div><strong style="color:var(--green)">Covered (${coveredFMs.length})</strong>${coveredFMs.map(function(f){return `<div style="padding:3px 0">✅ ${esc(f.fn)} (${esc(f.cn)})</div>`;}).join('')}</div>
      <div><strong style="color:var(--red)">Uncovered (${uncoveredFMs.length})</strong>${uncoveredFMs.map(function(f){return `<div style="padding:3px 0">❌ ${esc(f.fn)} (${esc(f.cn)})</div>`;}).join('')}</div>
    </div>`;

  if(uncoveredFMs.length>0){

    h+=`<div style="margin-top:12px;color:var(--green);font-size:.82rem">✅ All failure modes have detection signals</div>`;
  }

  return h;

function getComponentCriticality(componentName){
  var fms=S.p2.fm.filter(function(f){return f.cn===componentName;});
  if(!fms.length) return {label:'Unknown',rpv:0};
  var maxRPV=Math.max.apply(null,fms.map(function(f){return f.rpv||0;}));
  var label=maxRPV>=100?'Critical':maxRPV>=50?'High':maxRPV>=30?'Moderate':'Low';
  return {label:label,rpv:maxRPV};
}

function critColor(entityName){
  var crit=getComponentCriticality(entityName);
  if(crit.rpv>=100) return 'var(--red)';
  if(crit.rpv>=50) return 'var(--orange)';
  if(crit.rpv>=30) return 'var(--yellow)';
  if(crit.rpv>0) return 'var(--green)';
  return 'var(--text3)';
}

function getWorkflowCriticality(wfName){
  var fms=S.p2.fm.filter(function(f){return f.wf===wfName&&f.cn;});
  if(!fms.length){
    // No direct FMs — try rolling up from child component criticalities
    var children=S.p4.he.filter(function(e){return e.wf===wfName&&e.et!=='Workflow'&&e.et!=='Signal';});
    var childMaxRPV=0;var childFmCount=0;var childCritical=0;var childHigh=0;
    children.forEach(function(c){
      var cc=getComponentCriticality(c.en);
      if(cc.rpv>childMaxRPV) childMaxRPV=cc.rpv;
      if(cc.label!=='Unknown') childFmCount++;
      if(cc.rpv>=100) childCritical++;
      if(cc.rpv>=50&&cc.rpv<100) childHigh++;
    });
    if(childMaxRPV===0&&childFmCount===0) return {label:'Unknown',maxRPV:0,avgRPV:0,fmCount:0,criticalCount:0,highCount:0};
    var label=childMaxRPV>=100?'Critical':childMaxRPV>=50?'High':childMaxRPV>=30?'Moderate':'Low';
    return {label:label,maxRPV:childMaxRPV,avgRPV:childMaxRPV,fmCount:childFmCount,criticalCount:childCritical,highCount:childHigh};
  }
  var maxRPV=Math.max.apply(null,fms.map(function(f){return f.rpv||0;}));
  var avgRPV=Math.round(fms.reduce(function(a,f){return a+(f.rpv||0);},0)/fms.length);
  var criticalCount=fms.filter(function(f){return f.rpv>=100;}).length;
  var highCount=fms.filter(function(f){return f.rpv>=50&&f.rpv<100;}).length;
  var label=maxRPV>=100?'Critical':maxRPV>=50?'High':maxRPV>=30?'Moderate':'Low';
  return {label:label,maxRPV:maxRPV,avgRPV:avgRPV,fmCount:fms.length,criticalCount:criticalCount,highCount:highCount};
}

function _fmMeta(fmId){
  var fm=S.p2.fm.find(function(f){return (f.cn+'|'+f.fn)===fmId;});

  var rl=fm.rl||'';var rpv=fm.rpv||'';
  var cls=rl==='Critical'?'fm-link-critical':rl==='High'?'fm-link-high':rl==='Moderate'?'fm-link-moderate':'fm-link-low';
  return {rl:rl,rpv:rpv,cls:cls};
}

function showNodeDetail(entityName,entityType){
  var panel=document.getElementById('hm-node-detail');
  if(!panel) return;
  _hmDetailTarget={name:entityName,type:entityType||''};
  var entities=S.p4.he.filter(function(e){return e.en===entityName&&(!entityType||e.et===entityType);});
  if(!entities.length){panel.style.display='none';return;}
  var entity=entities.find(function(e){return e.et!=='Signal';})||entities[0];
  var et=entity.et;
  var wfList=[];
  entities.forEach(function(e){if(e.wf&&wfList.indexOf(e.wf)===-1)wfList.push(e.wf);});
  // Scope to current workflow tab to prevent cross-workflow signal dedup issues
  // (Platform components shared across workflows would otherwise show signals from all
  // workflows, causing delete to appear broken when a duplicate from another wf resurfaces)
  var curWf=(_wfTab&&_wfTab[3])||'';
  if(curWf&&wfList.indexOf(curWf)>=0) wfList=[curWf];
  var signals=S.p4.he.filter(function(e){return e.et==='Signal'&&e.en===entityName&&(wfList.length===0||wfList.indexOf(e.wf)>=0);});
  var seenSigs={},uniqueSignals=[];
  signals.forEach(function(s){
    if(!seenSigs[s.id]){seenSigs[s.id]=true;uniqueSignals.push(s);}
  });
  var seenFms={},uniqueFms=[];
  uniqueSignals.filter(function(s){return s.fmId;}).forEach(function(s){
    if(s.fmName&&!seenFms[s.fmName]){seenFms[s.fmName]=true;uniqueFms.push(s);}
  });
  var crit=getComponentCriticality(entityName);
  var h='<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:16px;animation:fadeIn .2s ease">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center">';
  h+='<h4 style="margin:0">'+esc(entityName)+' <span class="sb '+_etBadgeClass(et)+'">'+esc(et)+'</span></h4>';
  h+='<button class="del" style="font-size:1.2rem" onclick="document.getElementById(\'hm-node-detail\').style.display=\'none\'">✕</button></div>';
  h+='<p style="font-size:.82rem;color:var(--text2);margin:8px 0">Criticality: <strong>'+esc(crit.label)+'</strong> (max RPV: '+crit.rpv+' from Phase 1)</p>';
  if(et==='User/System Workflow'||et==='Workflow'){
    var wfCrit=getWorkflowCriticality(entity.wf||entity.en);
    h+='<p style="font-size:.82rem;color:var(--text2);margin:8px 0">Overall Criticality: <strong>'+esc(wfCrit.label)+'</strong> (max RPV: '+wfCrit.maxRPV+')</p>';
    var components={};
    S.p2.fm.filter(function(f){return f.wf===(entity.wf||entity.en)&&f.fn&&f.cn;})
      .forEach(function(f){
        if(!components[f.cn]) components[f.cn]={cn:f.cn,ct:f.ct,fms:0,maxRPV:0,worstRL:'Low'};
        components[f.cn].fms++;
        if((f.rpv||0)>components[f.cn].maxRPV){components[f.cn].maxRPV=f.rpv;components[f.cn].worstRL=f.rl||'Low';}
      });
    var compList=Object.values(components).sort(function(a,b){return b.maxRPV-a.maxRPV;});
    if(compList.length){
      h+='<div style="margin-top:12px"><strong style="font-size:.82rem">Component Risk Breakdown ('+compList.length+')</strong>';
      h+='<table style="width:100%;margin-top:6px;font-size:.78rem"><thead><tr><th>Component</th><th>FMs</th><th>Max RPV</th><th>Risk</th></tr></thead><tbody>';
      compList.forEach(function(c){
        h+='<tr><td>'+esc(c.cn)+'</td><td class="mono">'+c.fms+'</td><td class="mono">'+c.maxRPV+'</td><td>'+riskB(c.worstRL)+'</td></tr>';
      });
      h+='</tbody></table></div>';
    }
  }
  if(wfList.length>0){
    h+='<p style="font-size:.82rem;color:var(--text2)">Workflows: ';
    h+=wfList.map(function(w){return '<span class="sb su">'+esc(w)+'</span>';}).join(' ');
    h+='</p>';
  }

function AP4(){
  let wfA=0,compA=0,sigA=0;
  // 1. Import workflows from P1
  S.p1.wf.filter(w=>w.nm).forEach(w=>{
    if(!S.p4.he.find(e=>e.et==='Workflow'&&e.en===w.nm)){
      S.p4.he.push({id:uid(),_src:'inferred',et:'Workflow',en:w.nm,pa:'',wf:w.nm,
        mn:'',th:'',cv:'',hs:'Unknown',tr:'',at:'',
        ui:0,bi:0,ac:0,pd:0,ws:0,vs:'',fmId:'',fmName:'',nt:''});
      wfA++;
    }
  });
  // Also ensure P2 workflows get a Workflow row
  const p2Wfs=[...new Set(S.p2.fm.filter(f=>f.wf).map(f=>f.wf))];
  p2Wfs.forEach(wfName=>{
    if(!S.p4.he.find(e=>e.et==='Workflow'&&e.en===wfName)){
      S.p4.he.push({id:uid(),_src:'inferred',et:'Workflow',en:wfName,pa:'',wf:wfName,
        mn:'',th:'',cv:'',hs:'Unknown',tr:'',at:'',
        ui:0,bi:0,ac:0,pd:0,ws:0,vs:'',fmId:'',fmName:'',nt:''});
      wfA++;
    }
  });
  // 1b. Create User/System Workflow visible tree parent for each workflow
  S.p1.wf.filter(w=>w.nm).forEach(w=>{
    if(!S.p4.he.find(e=>e.et==='User/System Workflow'&&e.wf===w.nm)){
      S.p4.he.push({id:uid(),_src:'inferred',et:'User/System Workflow',en:w.nm,pa:'',connections:[],wf:w.nm,
        mn:'',th:'',cv:'',hs:'Unknown',tr:'',at:'',
        ui:0,bi:0,ac:0,pd:0,ws:0,vs:'',fmId:'',fmName:'',nt:''});
    }
  });
  p2Wfs.forEach(wfName=>{
    if(!S.p4.he.find(e=>e.et==='User/System Workflow'&&e.wf===wfName)){
      S.p4.he.push({id:uid(),_src:'inferred',et:'User/System Workflow',en:wfName,pa:'',connections:[],wf:wfName,
        mn:'',th:'',cv:'',hs:'Unknown',tr:'',at:'',
        ui:0,bi:0,ac:0,pd:0,ws:0,vs:'',fmId:'',fmName:'',nt:''});
    }
  });
  // 2. Import components from P2 as entity rows (no signal/FM on entity)
  S.p2.fm.filter(f=>f.cn).forEach(f=>{
    const et=f.ct==='Platform'?'Platform':'Application';
    if(!S.p4.he.find(e=>(e.et===et)&&e.en===f.cn&&e.wf===f.wf)){
      S.p4.he.push({id:uid(),_src:'inferred',et:et,en:f.cn,pa:'',wf:f.wf||'',
        mn:'',th:'',cv:'',hs:'Unknown',tr:'',at:'',
        ui:0,bi:0,ac:0,pd:0,ws:0,vs:'',fmId:'',fmName:'',nt:''});
      compA++;
    }
  });
  // 3. Import FM-linked signals as Signal sub-rows
  var suggest=(typeof SeqImport!=='undefined'&&SeqImport.suggestSignal)?SeqImport.suggestSignal:_suggestSignalFallback;
  S.p2.fm.filter(f=>f.fn&&f.cn&&f.rl&&f.rl!=='Not a Risk')
    .forEach(f=>{
      const fmId=f.cn+'|'+f.fn;
      if(S.p4.he.find(e=>e.fmId===fmId)) return;
      const et=f.ct==='Platform'?'Platform':'Application';
      // Ensure parent entity row exists
      if(!S.p4.he.find(e=>(e.et===et)&&e.en===f.cn&&e.wf===(f.wf||''))){
        S.p4.he.push({id:uid(),_src:'inferred',et:et,en:f.cn,pa:'',wf:f.wf||'',
          mn:'',th:'',cv:'',hs:'Unknown',tr:'',at:'',
          ui:0,bi:0,ac:0,pd:0,ws:0,vs:'',fmId:'',fmName:'',nt:''});
        compA++;
      }
      const suggestion=suggest(f.fn,f.cn,f.ct);
      S.p4.he.push({id:uid(),_src:'inferred',et:'Signal',en:f.cn,pa:f.cn,wf:f.wf||'',
        mn:suggestion.signal,th:suggestion.threshold,
        ui:0,bi:0,ac:0,pd:0,ws:0,vs:'',
        fmId:fmId,fmName:f.fn,
        nt:'Detects FM: '+f.fn+' (RPV: '+f.rpv+', '+f.rl+')'});
      sigA++;
    });
  // Auto-assign connections using generic fallback (no dependency graph)
  var calledBy = window._hmCalledBy || {};
  S.p4.he.forEach(function(e) {
    var conns = e.connections || (e.pa ? [e.pa] : []);
    if (e.et === 'Signal' || e.et === 'Workflow' || e.et === 'User/System Workflow' || conns.length > 0) return;
    var wf = e.wf;
    if (!wf) return;
    
    if (e.et === 'Application') {
      var bf = S.p4.he.find(function(p) { return p.et === 'User/System Workflow' && p.wf === wf; });
      if (bf) { e.pa = bf.en; e.connections = [bf.en]; }
    } else if (e.et === 'Platform') {
      var platCallers = (calledBy[e.en] || []);
      var callerApp = null;
      for (var j = 0; j < platCallers.length; j++) {
        callerApp = S.p4.he.find(function(p) {
          return p.et === 'Application' && p.en === platCallers[j] && p.wf === wf;
        });
        if (callerApp) break;
      }
      if (callerApp) {
        e.pa = callerApp.en; e.connections = [callerApp.en];
      } else {
        var app = S.p4.he.find(function(p) { return p.et === 'Application' && p.wf === wf; });
        if (app) { e.pa = app.en; e.connections = [app.en]; }
      }
    }
  });
  _wfTab[3]=null;
  calcP4(S.p4.he);sv();RP(3);
  const total=wfA+compA+sigA;
  if(total>0) SM('✅ Import',`Imported from Phase 1:<br>• ${wfA} workflow(s)<br>• ${compA} component(s)<br>• ${sigA} FM-linked signal(s)`);
  else SM('ℹ️ No New Items','All workflows, components, and failure modes already exist in Phase 3.');
}
