    </div>
    <p style="color:var(--muted);font-size:.9em;margin-top:8px">${ready?'✅ Operational posture looks solid — FMA data populated, mitigations in progress, health model entities defined.':'⚠️ Complete Phases 1–3 to build a comprehensive operational picture.'}</p>${(()=>{const fixes=[];if(critWf>0)fixes.push({m:'Critical Workflows',v:critWf,c:'var(--red)',t:'🟢 0 · 🔴 >0',f:'Reduce FM RPV scores below 50 in <b>Phase 1</b> (lower Impact, Likelihood, or Detectability)'});if(avgRPV>=30)fixes.push({m:'Avg RPV',v:avgRPV,c:avgRPV>=50?'var(--red)':'var(--yellow)',t:'🟢 &lt;30 · 🟡 30–49 · 🔴 ≥50',f:'Lower individual FM scores in <b>Phase 1</b> so the average drops below threshold'});if(mitPct<80)fixes.push({m:'Mitigation Coverage',v:mitPct+'%',c:mitPct>=50?'var(--yellow)':'var(--red)',t:'🟢 ≥80% · 🟡 50–79% · 🔴 &lt;50%',f:'In <b>Phase 2</b>, fill in Detection, Client Fix, Infra Fix, and Recovery for each mitigation row'});if(sigPct<80)fixes.push({m:'Signal Coverage',v:sigPct+'%',c:sigPct>=50?'var(--yellow)':'var(--red)',t:'🟢 ≥80% · 🟡 50–79% · 🔴 &lt;50%',f:'In <b>Phase 3</b> Health Model, add Health Signal + Threshold to Application/Platform entities'});return fixes.length?`<div style="margin-top:16px"><h4 style="margin:0 0 8px;font-size:.95em;color:var(--text)">🔧 How to Fix</h4><table style="width:100%;font-size:.85em;border-collapse:collapse"><thead><tr style="border-bottom:1px solid var(--border)"><th style="text-align:left;padding:6px 8px;color:var(--muted)">Metric</th><th style="text-align:center;padding:6px 8px;color:var(--muted)">Current</th><th style="text-align:left;padding:6px 8px;color:var(--muted)">Thresholds</th><th style="text-align:left;padding:6px 8px;color:var(--muted)">Remediation</th></tr></thead><tbody>${fixes.map(f=>`<tr style="border-bottom:1px solid var(--border)"><td style="padding:6px 8px">${f.m}</td><td style="padding:6px 8px;text-align:center;font-weight:700;color:${f.c}">${f.v}</td><td style="padding:6px 8px;color:var(--muted)">${f.t}</td><td style="padding:6px 8px">${f.f}</td></tr>`).join('')}</tbody></table></div>`:'';})()}</div>`;

  h+=`<div class="card"><h3>Governance Model <span class="cnt">${gv.length}</span></h3>
    <div class="table-wrap"><table><thead><tr><th>Governance Area</th><th>Owner</th><th>Frequency</th><th>Artifacts Reviewed</th><th>Output</th><th></th></tr></thead><tbody>`;
  if(!gv.length) h+=`<tr><td colspan="6" class="empty"><p>No governance entries yet.</p></td></tr>`;
  gv.forEach(g=>{
    const rc=g._src==='auto'?'row-auto':g._src==='inferred'?'row-inferred':'';
    h+=`<tr class="${rc}"><td>${ti(g.id,'ar',gdp,g.ar,'Area')}${srcTag(g)}</td><td>${ti(g.id,'ow',gdp,g.ow,'Owner')}</td><td>${sel(g.id,'fr',gdp,g.fr,['','Weekly','Bi-Weekly','Monthly','Quarterly','Annually'])}</td><td>${ti(g.id,'af',gdp,g.af,'Artifacts')}</td><td>${ti(g.id,'op',gdp,g.op,'Output')}</td><td><button class="del" onclick="DR('${gdp}','${g.id}')">✕</button></td></tr>`;
  });
  h+=`</tbody></table></div>
    <button class="add-row" onclick="AR('${gdp}',{ar:'',ow:'',fr:'',af:'',op:''})">+ Add Entry</button>${tplButtons(4)}</div>`;
  h+=nav(4)+'</div>';return h;
}

// ===== INSIGHTS TAB =====
function rInsights(){
  const fm=(S.p2.fm||[]).filter(f=>f.fn&&f.cn);
  const mt=S.p3.mt||[];
  const he=S.p4.he||[];
  const wfs=(S.p1.wf||[]).filter(w=>w.nm);

  // Per-FM gap analysis — placeholder until mtFMs defined below
  const fmGaps=fm.map(f=>{
    const hasMit=mt.some(m=>m.fm===f.fn);
    const hasSig=he.some(s=>s.et==='Signal'&&s.en===f.cn&&s.mn&&s.th&&(!f.wf||s.wf===f.wf));
    return {...f,hasMit,hasSig,missingMit:!hasMit,missingSig:!hasSig};
  });
  const uncovered=fmGaps.filter(f=>f.missingMit||f.missingSig);

  // Summary KPIs
  const totalFM=fm.length;
  const critRiskFMs=fm.filter(f=>f.rl==='Critical').length;
  const highRiskFMs=fm.filter(f=>f.rl==='High').length;
  const critHighFMs=critRiskFMs+highRiskFMs;
  const modRiskFMs=fm.filter(f=>f.rl==='Moderate').length;
  const critWfs=wfs.filter(w=>w.nm&&getWorkflowCriticality(w.nm).maxRPV>=50).length;
  const rpvFMs=fm.filter(f=>f.rpv>0);
  const avgRPV=rpvFMs.length?Math.round(rpvFMs.reduce((s,f)=>s+f.rpv,0)/rpvFMs.length):0;
  const mtFMs=mt.filter(m=>m.fm&&m.fm.trim()!=='');
  const mtTotal=mtFMs.length,mtDone=mtFMs.filter(m=>m.dm&&m.cm&&m.im&&m.rp).length;
  const mitPct=mtTotal?Math.round(mtDone/mtTotal*100):0;
  const leaves=he.filter(e=>e.et==='Application'||e.et==='Platform');
  const coveredLeaves=leaves.filter(e=>he.some(s=>s.et==='Signal'&&s.en===e.en&&(e.wf?s.wf===e.wf:true)&&s.mn&&s.th)).length;
  const sigPct=leaves.length?Math.round(coveredLeaves/leaves.length*100):0;
  const top10=fm.filter(f=>f.rpv>0).sort((a,b)=>b.rpv-a.rpv).slice(0,10);

  // Action queue (sorted by RPV)
  const actions=[];
  fmGaps.filter(f=>f.missingMit).forEach(f=>actions.push({type:'mitigation',label:`Complete mitigation for "${f.fn}"`,cn:f.cn,wf:f.wf,rpv:f.rpv,rl:f.rl}));
  fmGaps.filter(f=>f.missingSig).forEach(f=>actions.push({type:'signal',label:`Add signal for "${f.fn}"`,cn:f.cn,wf:f.wf,rpv:f.rpv,rl:f.rl}));
  actions.sort((a,b)=>b.rpv-a.rpv);

  // === SECTION 1: COVERAGE GAP REPORT ===
  let gapHTML=`<div class="card" id="ins-gap"><h3>🔍 Coverage Gap Report <span style="cursor:help;color:var(--muted);font-size:.75em;font-weight:400" title="Lists all failure modes missing either a mitigation strategy or a health signal. Sorted by RPV — highest risk gaps appear first. Use this to prioritize remediation work.">ℹ️</span></h3>`;
  if(!uncovered.length){
    gapHTML+=`<p style="color:var(--green);font-weight:600">✅ All failure modes have both mitigation and signals defined.</p>`;
  } else {
    gapHTML+=`<p style="color:var(--muted);font-size:.88em;margin-bottom:12px">${uncovered.length} failure mode${uncovered.length!==1?'s':''} with missing coverage, sorted by RPV.</p>`;
    gapHTML+=`<div class="table-wrap"><table><thead><tr><th>Workflow</th><th>Component</th><th>Failure Mode</th><th>RPV</th><th>Risk</th><th>Missing</th></tr></thead><tbody>`;
    [...uncovered].sort((a,b)=>b.rpv-a.rpv).forEach(f=>{
      const rc=f.rl==='Critical'||f.rl==='High'?'var(--red)':f.rl==='Moderate'?'var(--yellow)':'var(--green)';
      const tags=[];
      if(f.missingMit)tags.push(`<span style="background:rgba(239,68,68,.15);color:var(--red);padding:2px 7px;border-radius:10px;font-size:.78em;white-space:nowrap">No Mitigation</span>`);
      if(f.missingSig)tags.push(`<span style="background:rgba(245,158,11,.15);color:var(--yellow);padding:2px 7px;border-radius:10px;font-size:.78em;white-space:nowrap">No Signal</span>`);
      gapHTML+=`<tr>
        <td style="color:var(--muted);font-size:.88em">${esc(f.wf||'—')}</td>
        <td>${esc(f.cn)}</td><td>${esc(f.fn)}</td>
        <td style="font-weight:700;color:${rc}">${f.rpv||0}</td>
        <td style="color:${rc};font-weight:600">${f.rl||'—'}</td>
        <td><div style="display:flex;gap:4px;flex-wrap:wrap">${tags.join('')}</div></td>
      </tr>`;
    });
    gapHTML+=`</tbody></table></div>`;
  }
  gapHTML+=`</div>`;

  // === SECTION 2: RISK HEATMAP ===
  const compMap={};
  fmGaps.forEach(f=>{
    if(!compMap[f.cn])compMap[f.cn]={cn:f.cn,ct:f.ct,fms:[],covered:0,total:0,maxRPV:0,rl:'Low'};
    const c=compMap[f.cn];c.fms.push(f);c.total++;
    if(!f.missingMit&&!f.missingSig)c.covered++;
    if((f.rpv||0)>c.maxRPV){c.maxRPV=f.rpv||0;c.rl=f.rl||'Low';}
  });
  const comps=Object.values(compMap).sort((a,b)=>b.maxRPV-a.maxRPV);
  const rlLevels=['Critical','High','Moderate','Low'];

  function cellColor(rl,covPct){
    if(rl==='Critical')return covPct>=80?'#991b1b':covPct>=50?'#b91c1c':'#7f1d1d';
    if(rl==='High')return covPct>=80?'#16a34a':covPct>=50?'#d97706':'#dc2626';
    if(rl==='Moderate')return covPct>=80?'#16a34a':covPct>=50?'#d97706':'#ea580c';
    return covPct>=80?'#16a34a':'#65a30d';
  }

  let hmHTML=`<div class="card" id="ins-hm"><h3>🌡️ Risk Heatmap <span style="cursor:help;color:var(--muted);font-size:.75em;font-weight:400" title="Visual grid showing each component's risk level vs. coverage. Red = high risk with low coverage. Green = well covered. Cell values show FM count and coverage %.">ℹ️</span></h3>`;
  if(!comps.length){
    hmHTML+=`<p style="color:var(--muted)">No failure mode data. Complete Phase 1 first.</p>`;
  } else {
    const cols=comps.length;
    hmHTML+=`<div style="overflow-x:auto;overflow-y:visible;margin-bottom:20px;width:100%;max-width:100%"><div style="display:grid;grid-template-columns:90px repeat(${cols},minmax(90px,1fr));gap:3px;min-width:${90+cols*93}px">`;
    hmHTML+=`<div></div>`;
    comps.forEach(c=>{
      const label=c.cn.length>11?c.cn.slice(0,11)+'…':c.cn;
      hmHTML+=`<div style="background:var(--bg2);padding:5px 3px;text-align:center;font-size:.72em;font-weight:600;border-radius:4px;overflow:hidden;white-space:nowrap" title="${esc(c.cn)}">${esc(label)}</div>`;
    });
    rlLevels.forEach(rl=>{
      const rlBg=rl==='Critical'?'rgba(127,29,29,.25)':rl==='High'?'rgba(239,68,68,.1)':rl==='Moderate'?'rgba(245,158,11,.1)':'rgba(34,197,94,.1)';
      const rlFg=rl==='Critical'||rl==='High'?'var(--red)':rl==='Moderate'?'var(--yellow)':'var(--green)';
      hmHTML+=`<div style="background:${rlBg};color:${rlFg};font-size:.78em;font-weight:700;padding:7px 5px;border-radius:4px;display:flex;align-items:center">${rl}</div>`;
      comps.forEach(c=>{
        const fmsAt=c.fms.filter(f=>f.rl===rl);
        if(!fmsAt.length){
          hmHTML+=`<div style="background:var(--bg2);border-radius:4px;min-height:40px;opacity:.25"></div>`;
        } else {
          const covAt=fmsAt.filter(f=>!f.missingMit&&!f.missingSig).length;
          const pct=Math.round(covAt/fmsAt.length*100);
          hmHTML+=`<div title="${esc(c.cn)}: ${fmsAt.length} FM(s) · ${pct}% covered" style="background:${cellColor(rl,pct)};border-radius:4px;min-height:40px;padding:5px 3px;text-align:center;color:#fff;font-size:.78em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:default">
            <span style="font-weight:700">${fmsAt.length}</span><span style="opacity:.9">${pct}%</span></div>`;
        }
      });
    });
    hmHTML+=`</div></div>`;
    hmHTML+=`<div style="display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap;font-size:.8em;color:var(--muted)">
      <span style="display:flex;align-items:center;gap:5px"><span style="display:inline-block;width:13px;height:13px;border-radius:3px;background:#dc2626"></span>High risk, no coverage</span>
      <span style="display:flex;align-items:center;gap:5px"><span style="display:inline-block;width:13px;height:13px;border-radius:3px;background:#d97706"></span>Partial coverage</span>
      <span style="display:flex;align-items:center;gap:5px"><span style="display:inline-block;width:13px;height:13px;border-radius:3px;background:#16a34a"></span>Well covered</span>
      <span>· Cell: FM count / coverage %</span></div>`;
    hmHTML+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px;margin-bottom:8px">
      <h4 style="font-size:.9em;margin:0;color:var(--muted)">Component Details</h4>
      <button onclick="(function(btn){var tbl=document.getElementById('hm-comp-table');var hidden=tbl.style.display==='none';tbl.style.display=hidden?'':'none';btn.textContent=hidden?'▲ Minimize':'▼ Expand';})(this)" style="font-size:.78em;padding:2px 10px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--muted);cursor:pointer">▲ Minimize</button>
    </div>
    <div id="hm-comp-table"><div class="table-wrap"><table><thead><tr><th>Component</th><th>Type</th><th>Peak Risk</th><th>Max RPV</th><th>Total FMs</th><th>Covered</th><th>Coverage</th></tr></thead><tbody>`;
    comps.forEach(c=>{
      const pct=c.total?Math.round(c.covered/c.total*100):0;
      const rlc=c.rl==='Critical'||c.rl==='High'?'var(--red)':c.rl==='Moderate'?'var(--yellow)':'var(--green)';
      const bar=`<div style="display:flex;align-items:center;gap:6px"><div style="flex:1;height:6px;background:var(--border);border-radius:3px"><div style="width:${pct}%;height:100%;background:${pct>=80?'var(--green)':pct>=50?'var(--yellow)':'var(--red)'};border-radius:3px"></div></div><span style="font-size:.83em;font-weight:600;min-width:34px">${pct}%</span></div>`;
      hmHTML+=`<tr><td>${esc(c.cn)}</td><td style="color:var(--muted);font-size:.88em">${esc(c.ct||'—')}</td><td style="color:${rlc};font-weight:600">${c.rl}</td><td style="font-weight:700;color:${rlc}">${c.maxRPV}</td><td>${c.total}</td><td>${c.covered}</td><td style="min-width:120px">${bar}</td></tr>`;
    });
    hmHTML+=`</tbody></table></div></div>`;
  }
  hmHTML+=`</div>`;

  // === SECTION 3: ACTION QUEUE ===
  let aqHTML=`<div class="card" id="ins-aq"><h3>📋 Action Queue <span class="cnt">${actions.length}</span> <span style="cursor:help;color:var(--muted);font-size:.75em;font-weight:400" title="Auto-generated backlog of remediation tasks derived from coverage gaps. Sorted by RPV — highest priority items appear first. Each item tells you exactly what to fix and on which component.">ℹ️</span></h3>`;
  if(!actions.length){
    aqHTML+=`<p style="color:var(--green);font-weight:600">✅ No outstanding actions — all failure modes are covered.</p>`;
  } else {
    aqHTML+=`<p style="color:var(--muted);font-size:.88em;margin-bottom:12px">Auto-generated from coverage gaps, sorted by RPV (highest priority first).</p>`;
    aqHTML+=`<div class="table-wrap"><table><thead><tr><th>#</th><th>Action</th><th>Component</th><th>Workflow</th><th>RPV</th><th>Priority</th></tr></thead><tbody>`;
    actions.forEach((a,i)=>{
      const pri=a.rpv>=50?'<span style="color:var(--red)">🔴 High</span>':a.rpv>=30?'<span style="color:var(--yellow)">🟡 Moderate</span>':'<span style="color:var(--green)">🟢 Low</span>';
      const ic=a.type==='mitigation'?'🛡️':'📡';
      aqHTML+=`<tr><td style="color:var(--muted);font-size:.85em">${i+1}</td><td>${ic} ${esc(a.label)}</td><td style="color:var(--muted);font-size:.88em">${esc(a.cn)}</td><td style="color:var(--muted);font-size:.88em">${esc(a.wf||'—')}</td><td style="font-weight:700">${a.rpv}</td><td>${pri}</td></tr>`;
    });
    aqHTML+=`</tbody></table></div>`;
  }
  aqHTML+=`</div>`;

  // === SECTION 4: EXECUTIVE REPORT ===
  const statCards=[
    ['Total FMs',totalFM,'var(--accent)'],
    ['Critical+High FMs',critHighFMs,critHighFMs>0?'var(--red)':'var(--green)'],
    ['Critical Workflows',critWfs,critWfs>0?'var(--red)':'var(--green)'],
    ['Avg RPV',avgRPV,avgRPV>=50?'var(--red)':avgRPV>=30?'var(--yellow)':'var(--green)'],
    ['Mitigation Coverage',mitPct+'%',mitPct>=80?'var(--green)':mitPct>=50?'var(--yellow)':'var(--red)'],
    ['Signal Coverage',sigPct+'%',sigPct>=80?'var(--green)':sigPct>=50?'var(--yellow)':'var(--red)'],
    ['Open Actions',actions.length,actions.length>0?'var(--yellow)':'var(--green)'],
    ['Coverage Gaps',uncovered.length,uncovered.length>0?'var(--red)':'var(--green)'],
  ].map(([l,v,c])=>`<div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center"><div style="font-size:1.4em;font-weight:700;color:${c}">${v}</div><div style="font-size:.78em;color:var(--muted)">${l}</div></div>`).join('');

  const topFMsTable=top10.length?`<h4 style="font-size:.9em;margin:16px 0 8px;color:var(--muted)">Top ${top10.length} Failure Modes by RPV</h4>
    <div class="table-wrap"><table><thead><tr><th>Component</th><th>Failure Mode</th><th>RPV</th><th>Risk</th></tr></thead><tbody>
    ${top10.map(f=>{const c=f.rl==='Critical'||f.rl==='High'?'var(--red)':f.rl==='Moderate'?'var(--yellow)':'var(--green)';return`<tr><td>${esc(f.cn)}</td><td>${esc(f.fn)}</td><td style="font-weight:700;color:${c}">${f.rpv}</td><td style="color:${c}">${f.rl}</td></tr>`;}).join('')}
    </tbody></table></div>`:'' ;

  let exHTML=`<div class="card" id="ins-ex">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">
      <h3 style="margin:0">📄 Executive Report <span style="cursor:help;color:var(--muted);font-size:.75em;font-weight:400" title="Auto-generated resilience summary covering risk overview, top failure modes, coverage status, and key gaps. Export as PDF or copy as Markdown for leadership reporting.">ℹ️</span></h3>
      <div style="display:flex;gap:8px">
        <button class="btn btn-secondary" onclick="copyInsightsMarkdown()">📋 Copy Markdown</button>
        <button class="btn btn-primary" onclick="printInsightsReport()">🖨️ Print / Save PDF</button>
      </div>
    </div>
    <div id="insights-print-area">
      <h2 style="margin:0 0 2px;font-size:1.15em">${esc(S.wn||'Workload')} — Resilience Report</h2>
      <p style="color:var(--muted);font-size:.83em;margin:0 0 14px">Generated ${new Date().toLocaleDateString()}</p>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:4px">${statCards}</div>
      ${topFMsTable}
    </div>
  </div>`;

  // === SECTION 5: GOVERNANCE MATURITY SCORE ===
  const wfsWithFMs=wfs.filter(w=>w.nm&&fm.some(f=>f.wf===w.nm));
  const fmCovPct=wfs.length?Math.round(wfsWithFMs.length/wfs.length*100):0;
  const valTests=(S.p3.ct||[]).filter(t=>t.re&&t.re.trim()!=='');
  const valCovPct=totalFM?Math.round(Math.min(valTests.length/totalFM,1)*100):0;
  const matScore=Math.round((fmCovPct+mitPct+sigPct+valCovPct)/4);
  const matLevel=matScore>=75?'Advanced':matScore>=50?'Mature':matScore>=25?'Developing':'Initial';
  const matColor=matScore>=75?'var(--green)':matScore>=50?'var(--accent)':matScore>=25?'var(--yellow)':'var(--red)';
  const matPillars=[
    ['FM Coverage',fmCovPct,'% of workflows with at least one failure mode defined','📍 Phase 1 → Failure Mode Analysis → add at least one FM per workflow'],
    ['Mitigation',mitPct,'% of Phase 2 mitigation strategies with all 4 fields filled','📍 Phase 2 → Mitigation Strategy → fill in <b>Detection, Client Fix, Infra Fix, and Recovery</b> for each row'],
    ['Signals',sigPct,'% of Application/Platform components with a health signal and threshold configured','📍 Phase 3 → Health Model → add a Signal entity (with Metric + Threshold) linked to each App/Platform component'],
    ['Validation',valCovPct,'% of failure modes that have at least one chaos test result recorded','📍 Phase 2 → Chaos Test Plan → fill in the <b>Result</b> field (Pass / Partial / Fail) for each chaos test'],
  ];

  // Validation coverage breakdown (per FM)
  const fmValMap=fm.map(f=>{
    const test=(S.p3.ct||[]).find(t=>t.fm===f.fn&&(!t.wf||!f.wf||t.wf===f.wf));
    const hasResult=!!(test&&test.re&&test.re.trim()!=='');
    return{...f,test:test||null,hasResult};
  });
  const valCovered=fmValMap.filter(f=>f.hasResult).length;
  const valUncovered=fmValMap.length-valCovered;

  let matHTML=`<div class="card" id="ins-mat">
    <h3>🎯 Governance Maturity Score <span style="cursor:help;color:var(--muted);font-size:.75em;font-weight:400" title="Composite resilience maturity score (0–100) based on FM coverage, mitigation completeness, signal coverage, and validation rate. Higher scores indicate a more operationally mature resilience practice.">ℹ️</span></h3>
    <div style="display:flex;gap:24px;align-items:stretch;margin-bottom:20px;flex-wrap:wrap">
      <div style="text-align:center;background:var(--bg2);border:2px solid ${matColor};border-radius:12px;padding:20px 28px;min-width:130px;display:flex;flex-direction:column;justify-content:center;gap:4px">
        <div style="font-size:3em;font-weight:800;color:${matColor};line-height:1">${matScore}</div>
        <div style="font-size:.75em;color:var(--muted)">out of 100</div>
        <div style="font-size:.92em;font-weight:700;color:${matColor};margin-top:6px;border-top:1px solid ${matColor};padding-top:6px">${matLevel}</div>
      </div>
      <div style="flex:1;min-width:240px">
        <p style="color:var(--muted);font-size:.85em;margin:0 0 14px">Each pillar contributes equally (25 pts). Hover pillar name for details.</p>
        ${matPillars.map(([n,p,tip,hint])=>`<div style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;font-size:.83em;margin-bottom:4px">
            <span style="font-weight:600;cursor:help" title="${esc(tip)}">${n}</span>
            <span style="color:${p>=80?'var(--green)':p>=50?'var(--yellow)':'var(--red)'};font-weight:700">${p}%</span>
          </div>
          <div style="height:7px;background:var(--border);border-radius:4px;margin-bottom:4px"><div style="width:${p}%;height:100%;background:${p>=80?'var(--green)':p>=50?'var(--yellow)':'var(--red)'};border-radius:4px"></div></div>
          ${p<100?`<div style="font-size:.75em;color:var(--muted);line-height:1.4">${hint}</div>`:''}
        </div>`).join('')}
      </div>
    </div>
    <div style="font-size:.78em;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;margin-bottom:${fmValMap.length?'16px':'0'}">
      <span>🟢 <strong>Advanced</strong> ≥75</span>
      <span>🔵 <strong>Mature</strong> 50–74</span>
      <span>🟡 <strong>Developing</strong> 25–49</span>
      <span>🔴 <strong>Initial</strong> &lt;25</span>
    </div>
    ${fmValMap.length?`<div style="border-top:1px solid var(--border);padding-top:16px;margin-top:4px">
      <h4 style="font-size:.9em;margin:0 0 10px;color:var(--text)">📋 Validation Coverage Breakdown <span style="font-size:.8em;font-weight:400;color:var(--muted)">(${valCovered}/${fmValMap.length} FMs have a chaos test result)</span></h4>
      <div style="display:flex;gap:8px;margin-bottom:12px;font-size:.8em">
        <span style="background:rgba(34,197,94,.15);color:var(--green);padding:3px 10px;border-radius:10px;font-weight:600">✓ Covered: ${valCovered}</span>
        <span style="background:rgba(239,68,68,.12);color:var(--red);padding:3px 10px;border-radius:10px;font-weight:600">✗ Uncovered: ${valUncovered}</span>
      </div>
      <div class="table-wrap" style="max-height:260px;overflow-y:auto"><table style="font-size:.82em"><thead><tr>
        <th>Failure Mode</th><th>Workflow</th><th>Component</th><th>RPV</th><th>Test Result</th>
      </tr></thead><tbody>
      ${[...fmValMap].sort((a,b)=>a.hasResult-b.hasResult||b.rpv-a.rpv).map(f=>{
        const rc=f.rl==='Critical'||f.rl==='High'?'var(--red)':f.rl==='Moderate'?'var(--yellow)':'var(--green)';
        const reColor=f.test?.re==='Pass'?'var(--green)':f.test?.re==='Partial'?'var(--yellow)':f.test?.re==='Fail'?'var(--red)':'var(--muted)';
        const reLabel=f.hasResult?`<span style="color:${reColor};font-weight:600">${esc(f.test.re)}</span>`:`<span style="color:var(--muted);font-style:italic">No result — set in Phase 2</span>`;
        return`<tr><td>${esc(f.fn)}</td><td style="color:var(--muted);font-size:.9em">${esc(f.wf||'—')}</td><td>${esc(f.cn)}</td><td style="color:${rc};font-weight:700">${f.rpv||'—'}</td><td>${reLabel}</td></tr>`;
      }).join('')}
      </tbody></table></div>
    </div>`:''}
  </div>`;

  // === SECTION 6: MITIGATION EFFECTIVENESS ===
  const ctAll=(S.p3.ct||[]).filter(t=>t.re&&t.re.trim()!=='');
  const ctPass=ctAll.filter(t=>t.re==='Pass').length;
  const ctPartial=ctAll.filter(t=>t.re==='Partial').length;
  const ctFail=ctAll.filter(t=>t.re==='Fail').length;
  const ctPassPct=ctAll.length?Math.round(ctPass/ctAll.length*100):0;
  const rtVals=ctAll.filter(t=>t.rt&&!isNaN(parseFloat(t.rt))).map(t=>parseFloat(t.rt));
  const avgRT=rtVals.length?Math.round(rtVals.reduce((s,v)=>s+v,0)/rtVals.length*10)/10:null;
  let meHTML=`<div class="card" id="ins-me">
    <h3>⚗️ Mitigation Effectiveness <span style="cursor:help;color:var(--muted);font-size:.75em;font-weight:400" title="Tracks chaos test outcomes from Phase 2. Shows pass/fail rates and recovery time to validate that mitigations actually work, not just that they are defined.">ℹ️</span></h3>`;
  if(!ctAll.length){
    meHTML+=`<p style="color:var(--muted)">No chaos test results recorded yet. In Phase 2, fill in the <strong>Result</strong> and <strong>Recovery Time</strong> fields on chaos tests to see effectiveness metrics here.</p>`;
  } else {
    const bw=280,pw=Math.round(ctPass/ctAll.length*bw),ptw=Math.round(ctPartial/ctAll.length*bw);
    meHTML+=`<div style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:20px;align-items:flex-start">
      <div>
        <p style="font-size:.83em;color:var(--muted);margin:0 0 8px">Result Breakdown (${ctAll.length} tests)</p>
        <svg width="${bw}" height="34" viewBox="0 0 ${bw} 34" style="border-radius:6px;overflow:hidden;display:block">
          <rect x="0" y="0" width="${pw}" height="34" fill="#16a34a"/>
          <rect x="${pw}" y="0" width="${ptw}" height="34" fill="#d97706"/>
          <rect x="${pw+ptw}" y="0" width="${bw-pw-ptw}" height="34" fill="#dc2626"/>
        </svg>
        <div style="display:flex;gap:12px;font-size:.78em;margin-top:6px">
          <span style="color:#16a34a">✔ Pass: ${ctPass} (${ctPassPct}%)</span>
          <span style="color:#d97706">◐ Partial: ${ctPartial}</span>
          <span style="color:#dc2626">✖ Fail: ${ctFail}</span>
        </div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 18px;text-align:center"><div style="font-size:1.5em;font-weight:700;color:${ctPassPct>=80?'var(--green)':ctPassPct>=50?'var(--yellow)':'var(--red)'}">${ctPassPct}%</div><div style="font-size:.75em;color:var(--muted)">Pass Rate</div></div>
        ${avgRT!==null?`<div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 18px;text-align:center"><div style="font-size:1.5em;font-weight:700;color:var(--accent)">${avgRT}</div><div style="font-size:.75em;color:var(--muted)">Avg Recovery Time</div></div>`:''}
      </div>
    </div>
    <div class="table-wrap"><table><thead><tr><th>Failure Mode</th><th>Workflow</th><th>Scenario</th><th>Result</th><th>Recovery Time</th></tr></thead><tbody>
    ${ctAll.map(t=>{const rc=t.re==='Pass'?'var(--green)':t.re==='Partial'?'var(--yellow)':'var(--red)';return`<tr><td>${esc(t.fm)}</td><td style="color:var(--muted);font-size:.88em">${esc(t.wf||'—')}</td><td style="color:var(--muted);font-size:.85em">${esc(t.ts||'—')}</td><td style="color:${rc};font-weight:600">${esc(t.re)}</td><td>${t.rt?esc(t.rt):'—'}</td></tr>`;}).join('')}
    </tbody></table></div>`;
  }
  meHTML+=`</div>`;

  // === SECTION 7: CRITICAL PATH RISK ===
  const wfPaths=wfs.map(w=>{
    const wFMs=fm.filter(f=>f.wf===w.nm);
    if(!wFMs.length)return null;
    const byComp={};
    wFMs.forEach(f=>{
      if(!byComp[f.cn])byComp[f.cn]={cn:f.cn,ct:f.ct,maxRPV:0,rl:'Low'};
      if((f.rpv||0)>byComp[f.cn].maxRPV){byComp[f.cn].maxRPV=f.rpv;byComp[f.cn].rl=f.rl||'Low';}
    });
    const wk=Object.values(byComp).sort((a,b)=>b.maxRPV-a.maxRPV)[0];
    const wfCrit=getWorkflowCriticality(w.nm);
    const hasSig=wk?he.some(s=>s.et==='Signal'&&s.en===wk.cn&&s.mn&&s.th):false;
    return {wf:w.nm,weakest:wk,wfRl:wfCrit.label,maxRPV:wfCrit.maxRPV,fmCount:wFMs.length,sigCovered:hasSig};
  }).filter(Boolean).sort((a,b)=>b.maxRPV-a.maxRPV);
  let cpHTML=`<div class="card" id="ins-cp">
    <h3>🗺️ Critical Path Risk <span style="cursor:help;color:var(--muted);font-size:.75em;font-weight:400" title="Identifies the weakest link in each workflow — the component with the highest RPV. Components with no signal and high RPV represent the greatest unmanaged risk exposure.">ℹ️</span></h3>`;
  if(!wfPaths.length){
    cpHTML+=`<p style="color:var(--muted)">No failure mode data. Complete Phase 1 and 2 to see critical path analysis.</p>`;
  } else {
    cpHTML+=`<p style="color:var(--muted);font-size:.85em;margin-bottom:12px">Each row shows the weakest component (highest RPV) in a workflow, sorted by max RPV. ⚠️ No Signal = undetectable risk.</p>
    <div class="table-wrap"><table><thead><tr><th>Workflow</th><th>Risk</th><th>Weakest Link</th><th>Type</th><th>Max RPV</th><th>FMs</th><th>Signal</th></tr></thead><tbody>
    ${wfPaths.map(p=>{
      const wrc=p.wfRl==='Critical'||p.wfRl==='High'?'var(--red)':p.wfRl==='Moderate'?'var(--yellow)':'var(--green)';
      const wk=p.weakest;
      return`<tr>
        <td style="font-weight:600">${esc(p.wf)}</td>
        <td style="color:${wrc};font-weight:600">${p.wfRl}</td>
        <td style="font-weight:600">${wk?esc(wk.cn):'—'}</td>
        <td style="color:var(--muted);font-size:.88em">${wk?esc(wk.ct||'—'):'—'}</td>
        <td style="font-weight:700;color:${wrc}">${wk?wk.maxRPV:0}</td>
        <td>${p.fmCount}</td>
        <td>${p.sigCovered?'<span style="color:var(--green)">✅</span>':'<span style="color:var(--red)">⚠️ No Signal</span>'}</td>
      </tr>`;
    }).join('')}
    </tbody></table></div>`;
  }
  cpHTML+=`</div>`;

  // === SECTION 8: SCENARIO SIMULATION ===
  const simComps=[...new Set(fm.map(f=>f.cn))].filter(Boolean).sort();
  let scenHTML=`<div class="card" id="ins-sim">
    <h3>🧪 Scenario Simulation <span style="cursor:help;color:var(--muted);font-size:.75em;font-weight:400" title="Simulate the impact of a component failure. Select any component to see affected failure modes, impacted workflows, total risk exposure, and coverage gaps — helping you understand cascading risk.">ℹ️</span></h3>
    <p style="color:var(--muted);font-size:.85em;margin:0 0 12px">Select a component to simulate what happens if it fails — see cascading risk across failure modes and workflows.</p>
    <select id="sim-comp-sel" onchange="runScenario(this.value)" style="padding:7px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:.88em;max-width:340px;margin-bottom:12px">
      <option value="">— Select a component —</option>
      ${simComps.map(cn=>`<option value="${esc(cn)}">${esc(cn)}</option>`).join('')}
    </select>
    <div id="sim-result" style="color:var(--muted);font-size:.85em"></div>
  </div>`;

  // === SIGNAL EFFECTIVENESS DASHBOARD ===
  const hsSig=S.p5.ae||[];
  let alertHTML=`<div class="card" id="ins-alert">
    <h3>📡 Signal Effectiveness Dashboard <span style="cursor:help;color:var(--muted);font-size:.75em;font-weight:400" title="Track alert noise, false positives, and mean time to detect. Enter metrics manually per monitoring period.">ℹ️</span></h3>`;
  if(hsSig.length===0){
    alertHTML+=`<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px">
      <p style="margin:0;font-size:.88em;color:var(--muted)">Log alert metrics for each monitoring period to compute signal accuracy, noise ratio, and MTTD.</p>
      <button class="btn btn-primary btn-sm" onclick="AR('p5.ae',{pe:'',at:0,ai:0,fp:0,mt:0})">+ Add Period</button>
    </div>
    <div style="text-align:center;padding:24px;color:var(--muted);font-size:.88em">No periods logged yet — add your first monitoring period above.</div>`;
  } else {
    alertHTML+=`<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px">
      <div style="display:flex;gap:24px;flex-wrap:wrap">`;
    // Aggregate totals
    const totAt=hsSig.reduce((s,r)=>s+(+r.at||0),0);
    const totAi=hsSig.reduce((s,r)=>s+(+r.ai||0),0);
    const totFp=hsSig.reduce((s,r)=>s+(+r.fp||0),0);
    const avgMt=hsSig.length?Math.round(hsSig.reduce((s,r)=>s+(+r.mt||0),0)/hsSig.length):0;
    const accPct=totAt>0?Math.round((totAi/totAt)*100):0;
    const noiseRatio=totAt>0?Math.round((totFp/totAt)*100):0;
    const accCol=accPct>=80?'var(--green)':accPct>=60?'var(--yellow)':'var(--red)';
    const noiseCol=noiseRatio<=20?'var(--green)':noiseRatio<=40?'var(--yellow)':'var(--red)';
    alertHTML+=`<div style="text-align:center"><div style="font-size:1.5em;font-weight:700;color:${accCol}">${accPct}%</div><div style="font-size:.78em;color:var(--muted)">Signal Accuracy</div></div>
      <div style="text-align:center"><div style="font-size:1.5em;font-weight:700;color:${noiseCol}">${noiseRatio}%</div><div style="font-size:.78em;color:var(--muted)">Noise Ratio</div></div>
      <div style="text-align:center"><div style="font-size:1.5em;font-weight:700;color:var(--accent)">${avgMt}min</div><div style="font-size:.78em;color:var(--muted)">Avg MTTD</div></div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="AR('p5.ae',{pe:'',at:0,ai:0,fp:0,mt:0})">+ Add Period</button>
    </div>
    <table style="width:100%;border-collapse:collapse;font-size:.85em">
      <thead><tr style="border-bottom:1px solid var(--border)">
        <th style="text-align:left;padding:6px 8px;color:var(--muted)">Period</th>
        <th style="text-align:center;padding:6px 8px;color:var(--muted)">Alerts Triggered</th>
        <th style="text-align:center;padding:6px 8px;color:var(--muted)">Actual Incidents</th>
        <th style="text-align:center;padding:6px 8px;color:var(--muted)">False Positives</th>
        <th style="text-align:center;padding:6px 8px;color:var(--muted)">MTTD (min)</th>
        <th style="text-align:center;padding:6px 8px;color:var(--muted)">Accuracy</th>
        <th style="padding:4px"></th>
      </tr></thead><tbody>`;
    hsSig.forEach(r=>{
      const acc=+r.at>0?Math.round((+r.ai/+r.at)*100):0;
      const ac=acc>=80?'var(--green)':acc>=60?'var(--yellow)':'var(--red)';
      alertHTML+=`<tr style="border-bottom:1px solid var(--border)">
        <td style="padding:5px 8px">${ti(r.id,'pe','p5.ae',r.pe||'','e.g. Week 1, Apr 2025')}</td>
        <td style="padding:5px 8px;text-align:center">${ti(r.id,'at','p5.ae',r.at||'','0')}</td>
        <td style="padding:5px 8px;text-align:center">${ti(r.id,'ai','p5.ae',r.ai||'','0')}</td>
        <td style="padding:5px 8px;text-align:center">${ti(r.id,'fp','p5.ae',r.fp||'','0')}</td>
        <td style="padding:5px 8px;text-align:center">${ti(r.id,'mt','p5.ae',r.mt||'','0')}</td>
        <td style="padding:5px 8px;text-align:center;font-weight:700;color:${ac}">${+r.at>0?acc+'%':'—'}</td>
        <td style="padding:5px 8px;text-align:center"><button class="btn btn-sm" style="color:var(--red);padding:2px 8px" onclick="DR('p5.ae','${r.id}')">✕</button></td>
      </tr>`;
    });
    alertHTML+=`</tbody></table>`;
  }
  alertHTML+=`</div>`;

  // === SLA / SLO ALIGNMENT ===
  const slSLOs=S.p5.sl||[];
  let slaHTML=`<div class="card" id="ins-sla">
    <h3>📏 SLA / SLO Alignment <span style="cursor:help;color:var(--muted);font-size:.75em;font-weight:400" title="Define SLOs and link them to workflows. The tool will show which failure modes threaten each SLO.">ℹ️</span></h3>`;
  if(slSLOs.length===0){
    slaHTML+=`<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px">
      <p style="margin:0;font-size:.88em;color:var(--muted)">Define SLOs and link them to workflows to see which failure modes threaten SLA compliance.</p>
      <button class="btn btn-primary btn-sm" onclick="AR('p5.sl',{nm:'',wf:'',tg:99,nt:''})">+ Add SLO</button>
    </div>
    <div style="text-align:center;padding:24px;color:var(--muted);font-size:.88em">No SLOs defined yet — add your first SLO above.</div>`;
  } else {
    // For each SLO, find FMs in its linked workflow and compute risk
    slaHTML+=`<div style="display:flex;justify-content:flex-end;margin-bottom:12px">
      <button class="btn btn-primary btn-sm" onclick="AR('p5.sl',{nm:'',wf:'',tg:99,nt:''})">+ Add SLO</button>
    </div>`;
    slSLOs.forEach(sl=>{
      const wfOpts=[''].concat(wfs.map(w=>w.nm));
      const linkedFMs=sl.wf?fm.filter(f=>f.wf===sl.wf||f.fn&&fm.some(x=>x.wf===sl.wf&&x.fn===f.fn)):[];
      const threateningFMs=linkedFMs.filter(f=>f.rpv>=30).sort((a,b)=>b.rpv-a.rpv);
      const highRiskCount=threateningFMs.filter(f=>f.rpv>=50).length;
      const riskCol=highRiskCount>0?'var(--red)':threateningFMs.length>0?'var(--yellow)':'var(--green)';
      const mitigatedThreat=threateningFMs.filter(f=>(S.p3.mt||[]).some(m=>m.fm===f.fn&&m.dm&&m.cm&&m.im&&m.rp)).length;
      slaHTML+=`<div style="border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px">
          <div style="flex:1;min-width:240px">
            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
              ${ti(sl.id,'nm','p5.sl',sl.nm||'','SLO name, e.g. API Availability')}
              <span style="color:var(--muted);font-size:.83em">Target:</span>
              ${ti(sl.id,'tg','p5.sl',sl.tg||'','e.g. 99.9')}%
              <span style="color:var(--muted);font-size:.83em">Workflow:</span>
              ${sel(sl.id,'wf','p5.sl',sl.wf||'',wfOpts)}
            </div>
            <div style="font-size:.83em;color:var(--muted)">${ti(sl.id,'nt','p5.sl',sl.nt||'','Notes (optional)')}</div>
          </div>
          <div style="display:flex;gap:16px;align-items:center">
            ${sl.wf?`<div style="text-align:center"><div style="font-size:1.3em;font-weight:700;color:${riskCol}">${threateningFMs.length}</div><div style="font-size:.75em;color:var(--muted)">Threatening FMs</div></div>
            <div style="text-align:center"><div style="font-size:1.3em;font-weight:700;color:var(--green)">${mitigatedThreat}</div><div style="font-size:.75em;color:var(--muted)">Mitigated</div></div>`:'<span style="font-size:.83em;color:var(--muted)">Link a workflow to see risk</span>'}
            <button class="btn btn-sm" style="color:var(--red);padding:2px 8px" onclick="DR('p5.sl','${sl.id}')">✕</button>
          </div>
        </div>
        ${threateningFMs.length>0?`<div style="margin-top:10px;border-top:1px solid var(--border);padding-top:10px">
          <div style="font-size:.8em;color:var(--muted);margin-bottom:6px;font-weight:600">Threatening Failure Modes (RPV ≥ 30):</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${threateningFMs.slice(0,8).map(f=>`<span style="font-size:.78em;padding:2px 7px;border-radius:4px;background:${f.rpv>=50?'rgba(255,80,80,.12)':'rgba(255,180,0,.1)'};color:${f.rpv>=50?'var(--red)':'var(--yellow)'};border:1px solid ${f.rpv>=50?'rgba(255,80,80,.3)':'rgba(255,180,0,.25)'}">${esc(f.fn||'—')} (RPV ${f.rpv})</span>`).join('')}
            ${threateningFMs.length>8?`<span style="font-size:.78em;color:var(--muted)">+${threateningFMs.length-8} more</span>`:''}
          </div>
        </div>`:''}
      </div>`;
    });
  }
  slaHTML+=`</div>`;

  // Summary KPI bar
  const kpiBar=`<div class="card" style="background:var(--bg2);padding:14px 18px">
    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">
      <span style="font-weight:700;color:var(--accent);font-size:.95em">📊 Insights</span>
      ${[
        [`${totalFM} FMs`,totalFM>0?'var(--text)':'var(--muted)'],
        [`${critHighFMs} Critical+High`,critHighFMs>0?'var(--red)':'var(--muted)'],
        [`${uncovered.length} Gap${uncovered.length!==1?'s':''}`,uncovered.length>0?'var(--yellow)':'var(--green)'],
        [`${actions.length} Action${actions.length!==1?'s':''}`,actions.length>0?'var(--yellow)':'var(--green)'],
        [`${mitPct}% Mitigated`,mitPct>=80?'var(--green)':mitPct>=50?'var(--yellow)':'var(--red)'],
        [`${sigPct}% Signals`,sigPct>=80?'var(--green)':sigPct>=50?'var(--yellow)':'var(--red)'],
      ].map(([l,c])=>`<span style="color:${c};font-size:.88em;font-weight:600">${l}</span>`).join(`<span style="color:var(--border)"> | </span>`)}
    </div>
  </div>`;

  return `<div class="phase-panel active${_rcUpdate?'':' fade-in'}">
    <div class="phase-header">
      <h2>📊 Insights</h2>
      <p class="desc">Coverage analysis, risk heatmap, maturity score, action queue, and executive reporting derived from your FMA and health model data.</p>
      <div class="deliverables">
        <span class="tag tag-accent">Coverage Gaps</span>
        <span class="tag tag-green">Risk Heatmap</span>
        <span class="tag tag-blue">Maturity Score</span>
        <span class="tag tag-orange">Executive Report</span>
      </div>
    </div>
    ${kpiBar}
    ${matHTML}
    ${gapHTML}
    ${hmHTML}
    ${aqHTML}
    ${meHTML}
    ${cpHTML}
    ${scenHTML}
    ${alertHTML}
    ${slaHTML}
    ${exHTML}
    <div class="phase-nav">
      <button class="btn btn-secondary" onclick="GP(4)">← Previous</button>
      <div></div><div></div>
    </div>
  </div>`;
}

function printInsightsReport(){
  const el=document.getElementById('insights-print-area');
  if(!el)return;

function copyInsightsMarkdown(){
  const fm=(S.p2.fm||[]).filter(f=>f.fn&&f.cn);
  const mt=S.p3.mt||[];const he=S.p4.he||[];
  const wfs=(S.p1.wf||[]).filter(w=>w.nm);
  const fmGaps=fm.map(f=>{
    const hasMit=mt.some(m=>m.fm===f.fn);
    const hasSig=he.some(s=>s.et==='Signal'&&s.en===f.cn&&s.mn&&s.th&&(!f.wf||s.wf===f.wf));
    return {...f,hasMit,hasSig,missingMit:!hasMit,missingSig:!hasSig};
  });
  const uncovered=fmGaps.filter(f=>f.missingMit||f.missingSig);
  const totalFM=fm.length;
  const highRiskFMs=fm.filter(f=>f.rl==='High').length;
  const modRiskFMs=fm.filter(f=>f.rl==='Moderate').length;
  const critWfs=wfs.filter(w=>w.nm&&getWorkflowCriticality(w.nm).maxRPV>=50).length;
  const rpvFMs=fm.filter(f=>f.rpv>0);
  const avgRPV=rpvFMs.length?Math.round(rpvFMs.reduce((s,f)=>s+f.rpv,0)/rpvFMs.length):0;
  const mtFMs=mt.filter(m=>m.fm&&m.fm.trim()!=='');
  const mtTotal=mtFMs.length,mtDone=mtFMs.filter(m=>m.dm&&m.cm&&m.im&&m.rp).length;
  const mitPct=mtTotal?Math.round(mtDone/mtTotal*100):0;
  const leaves=he.filter(e=>e.et==='Application'||e.et==='Platform');
  const coveredLeaves=leaves.filter(e=>he.some(s=>s.et==='Signal'&&s.en===e.en&&(e.wf?s.wf===e.wf:true)&&s.mn&&s.th)).length;
  const sigPct=leaves.length?Math.round(coveredLeaves/leaves.length*100):0;
  const top10=fm.filter(f=>f.rpv>0).sort((a,b)=>b.rpv-a.rpv).slice(0,10);
  const actions=[];
  fmGaps.filter(f=>f.missingMit).forEach(f=>actions.push({label:`Complete mitigation for "${f.fn}"`,cn:f.cn,wf:f.wf,rpv:f.rpv}));
  fmGaps.filter(f=>f.missingSig).forEach(f=>actions.push({label:`Add signal for "${f.fn}"`,cn:f.cn,wf:f.wf,rpv:f.rpv}));
  actions.sort((a,b)=>b.rpv-a.rpv);
  const lines=[
    `# Resilience Report — ${S.wn||'Unnamed Workload'}`,
    `Generated: ${new Date().toLocaleDateString()}`,``,
    `## Risk Overview`,
    `| Metric | Value |`,`|--------|-------|`,
    `| Total Failure Modes | ${totalFM} |`,
    `| High+Critical Risk FMs | ${fm.filter(f=>f.rl==='Critical'||f.rl==='High').length} |`,
    `| Moderate Risk FMs | ${modRiskFMs} |`,
    `| Critical Workflows | ${critWfs} |`,
    `| Avg RPV | ${avgRPV} |`,
    `| Mitigation Coverage | ${mitPct}% |`,
    `| Signal Coverage | ${sigPct}% |`,``,
    `## Top ${top10.length} Failure Modes by RPV`,
    `| Component | Failure Mode | RPV | Risk |`,`|-----------|-------------|-----|------|`,
    ...top10.map(f=>`| ${f.cn} | ${f.fn} | ${f.rpv} | ${f.rl} |`),``,
    `## Coverage Status`,
    `- Mitigation Coverage: ${mitPct}% (${mtDone}/${mtTotal} completed)`,
    `- Signal Coverage: ${sigPct}% (${coveredLeaves}/${leaves.length} entities with signals)`,``,
    `## Key Gaps`,
    ...(uncovered.length?[
      `| Component | Failure Mode | RPV | Missing |`,`|-----------|-------------|-----|---------|`,
      ...uncovered.slice(0,15).map(f=>{const m=[];if(f.missingMit)m.push('Mitigation');if(f.missingSig)m.push('Signal');return`| ${f.cn} | ${f.fn} | ${f.rpv} | ${m.join(', ')} |`;})
    ]:['No coverage gaps identified.']),``,
    `## Recommended Actions`,
    ...actions.slice(0,15).map((a,i)=>`${i+1}. ${a.label} (${a.cn}, RPV: ${a.rpv})`),
  ];
  const md=lines.join('\n');
  navigator.clipboard.writeText(md).then(()=>{
    _insightsCopyFeedback();
  }).catch(()=>{
    const ta=document.createElement('textarea');ta.value=md;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    _insightsCopyFeedback();
  });
}

function runScenario(cn){
  var el=document.getElementById('sim-result');
  if(!el)return;
  if(!cn){el.innerHTML='';return;}
  var fmAll=S.p2.fm.filter(function(f){return f.fn&&f.cn;});
  var mt=S.p3.mt;var he=S.p4.he;
  var compFMs=fmAll.filter(function(f){return f.cn===cn;});
  if(!compFMs.length){el.innerHTML='<p style="color:var(--muted)">No failure modes defined for this component.</p>';return;}
  var affWfs=[...new Set(compFMs.map(function(f){return f.wf;}).filter(Boolean))];
  var maxRPV=Math.max.apply(null,compFMs.map(function(f){return f.rpv||0;}));
  var worstRL=maxRPV>=100?'Critical':maxRPV>=50?'High':maxRPV>=30?'Moderate':'Low';
  var noMit=compFMs.filter(function(f){return!mt.some(function(m){return m.fm===f.fn;});});
  var noSig=compFMs.filter(function(f){return!he.some(function(s){return s.et==='Signal'&&s.en===cn&&s.mn&&s.th;});});
  var rc=worstRL==='Critical'||worstRL==='High'?'var(--red)':worstRL==='Moderate'?'var(--yellow)':'var(--green)';
  var stats=[[compFMs.length+' Failure Modes','var(--accent)'],[affWfs.length+' Workflow'+(affWfs.length!==1?'s':'')+' Impacted',affWfs.length>0?'var(--yellow)':'var(--muted)'],['Max RPV: '+maxRPV,rc],['Risk: '+worstRL,rc],[noMit.length>0?noMit.length+' No Mitigation':'Mitigations OK',noMit.length>0?'var(--red)':'var(--green)'],[noSig.length>0?noSig.length+' No Signal':'Signals OK',noSig.length>0?'var(--red)':'var(--green)']];
  var html='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">';
  stats.forEach(function(s){html+='<div style="background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:8px 14px;text-align:center"><div style="font-size:.88em;font-weight:700;color:'+s[1]+'">'+esc(s[0])+'</div></div>';});
  html+='</div>';
  if(affWfs.length)html+='<div style="font-size:.83em;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><strong style="color:var(--text2)">Affected workflows:</strong>'+affWfs.map(function(w){return '<span style="display:inline-block;padding:2px 10px;border-radius:4px;border:1px solid var(--border);background:var(--bg2);color:var(--text1);font-family:monospace">'+esc(w)+'</span>';}).join('')+'</div>';
  html+='<div class="table-wrap"><table><thead><tr><th>Failure Mode</th><th>RPV</th><th>Risk</th><th>Mitigation</th><th>Signal</th></tr></thead><tbody>';
  compFMs.sort(function(a,b){return(b.rpv||0)-(a.rpv||0);}).forEach(function(f){
    var hasMit=mt.some(function(m){return m.fm===f.fn;});
    var hasSig=he.some(function(s){return s.et==='Signal'&&s.en===cn&&s.mn&&s.th;});
    var frc=f.rl==='Critical'||f.rl==='High'?'var(--red)':f.rl==='Moderate'?'var(--yellow)':'var(--green)';
    html+='<tr><td>'+esc(f.fn)+'</td><td style="font-weight:700;color:'+frc+'">'+f.rpv+'</td><td style="color:'+frc+'">'+f.rl+'</td><td>'+(hasMit?'<span style="color:var(--green)">✅</span>':'<span style="color:var(--red)">❌</span>')+'</td><td>'+(hasSig?'<span style="color:var(--green)">✅</span>':'<span style="color:var(--red)">❌</span>')+'</td></tr>';
  });
  html+='</tbody></table></div>';
  el.innerHTML=html;
}

function ulXLSX(phase){
  var inp=document.createElement('input');inp.type='file';inp.accept='.xlsx';
  inp.onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(ev){
      var wb=XLSX.read(ev.target.result,{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var data=XLSX.utils.sheet_to_json(ws,{header:1});
      if(phase===1){
        parseXLSXPhase1(data);
      } else {
        // Fallback for other phases: convert to CSV-like and use old parser
        var t=TPL[phase];if(!t)return;
        var arr=getArr(t.dest);
        var startRow=0;
        for(var ri=0;ri<data.length;ri++){
          if(data[ri]&&data[ri].length>1&&data[ri].some(function(c){return c;})){
            var firstCell=String(data[ri][0]||'').trim();
            if(firstCell===t.cols[0]||firstCell===t.cols[0].split(' ')[0]){startRow=ri+1;break;}
          }
        }
        if(startRow===0)startRow=1;
        var added=0;
        for(var di=startRow;di<data.length;di++){
          var row=data[di];
          if(!row||!row.some(function(c){return c;}))continue;
          var strRow=row.map(function(c){return String(c||'');});
          var item=t.parse(strRow);
          if(item.nm||item.fn||item.fm||item.sc||item.wf||item.en||item.ga||item.cn||item.ts||item.co||item.hs||item.ar||item.mn||item.et){
            arr.push(item);added++;
          }
        }
        if(t.calc)t.calc();
        sv();RP(S.cp);
        SM('✅ Import Complete','Imported '+added+' rows into Phase '+phase+'.');
      }
    };
    r.readAsArrayBuffer(f);
  };
  inp.click();
}

function syncFMToHealthEntities(failureModes){
  // Sync imported failure modes to health entities in S.p4.he
  // Collect unique workflows and components from failure modes
  var workflows={};
  var components=[];
  
  failureModes.forEach(function(fm){
    if(fm.wf){
      workflows[fm.wf]=true;
    }
    if(fm.cn){
      components.push({wf:fm.wf,ct:fm.ct,cn:fm.cn});
    }
  });
  
  // Create workflow entities for any missing workflows
  Object.keys(workflows).forEach(function(wfName){
    if(!wfName)return;
    var exists=S.p4.he.find(function(e){
      return e.et==='User/System Workflow' && e.wf===wfName;
    });
    if(!exists){
      S.p4.he.push({
        id:uid(), _src:'inferred', et:'User/System Workflow', en:wfName, pa:'', connections:[], wf:wfName,
        mn:'', th:'', cv:'', hs:'Unknown', tr:'', at:'',
        ui:0, bi:0, ac:0, pd:0, ws:0, vs:'', fmId:'', fmName:'', nt:''
      });
    }
  });
  
  // Create component entities for any missing components
  var seen={};
  components.forEach(function(comp){
    var key=comp.wf+'|'+comp.ct+'|'+comp.cn;
    if(seen[key])return;
    seen[key]=true;
    
    var exists=S.p4.he.find(function(e){
      return e.en===comp.cn && e.wf===comp.wf && 
        (e.et===comp.ct || (comp.ct==='Application' && e.et==='Application') || (comp.ct==='Platform' && e.et==='Platform'));
    });
    
    if(!exists){
      var parentName='';
      var parentConns=[];
      
      if(comp.ct==='Application'){
        // Application parent is the workflow
        var wfEntity=S.p4.he.find(function(e){
          return e.et==='User/System Workflow' && e.wf===comp.wf;
        });
        if(wfEntity){
          parentName=wfEntity.en;
          parentConns=[wfEntity.en];
        }
      } else if(comp.ct==='Platform'){
        // Platform parent is an Application if one exists, otherwise workflow
        var appEntity=S.p4.he.find(function(e){
          return e.et==='Application' && e.wf===comp.wf;
        });
        if(appEntity){
          parentName=appEntity.en;
          parentConns=[appEntity.en];
        } else {
          var wfEntity=S.p4.he.find(function(e){
            return e.et==='User/System Workflow' && e.wf===comp.wf;
          });
          if(wfEntity){
            parentName=wfEntity.en;
            parentConns=[wfEntity.en];
          }
        }
      }
      
      S.p4.he.push({
        id:uid(), _src:'inferred', et:comp.ct, en:comp.cn, pa:parentName, connections:parentConns, wf:comp.wf,
        mn:'', th:'', cv:'', hs:'Unknown', tr:'', at:'',
        ui:0, bi:0, ac:0, pd:0, ws:0, vs:'', fmId:'', fmName:'', nt:''
      });
    }
  });
  
  // Recalculate health model
  calcP4(S.p4.he);
}

function cleanOrphanedHealthEntities(){
  if(!S.p4||!S.p4.he||!S.p2||!S.p2.fm) return;
  // Collect active component names and their workflows from failure modes
  var activeCN={};
  var activeWF={};
  S.p2.fm.forEach(function(f){
    if(f.cn) activeCN[f.wf+'|'+f.cn]=true;
    if(f.wf) activeWF[f.wf]=true;
  });
  S.p4.he=S.p4.he.filter(function(e){
    // Preserve user-created entities (non-inferred)
    if(e._src && e._src!=='inferred') return true;
    // Remove orphaned component entities (Application/Platform)
    if(e.et==='Application'||e.et==='Platform'){
      return !!activeCN[e.wf+'|'+e.en];
    }
    // Remove orphaned workflow entities
    if(e.et==='User/System Workflow'){
      return !!activeWF[e.wf||e.en];
    }
    // Remove orphaned Signal entities whose parent component is gone
    if(e.et==='Signal'){
      return !!activeCN[e.wf+'|'+e.en];
    }
    return true;
  });
  calcP4(S.p4.he);
}

function parseXLSXPhase1(data){
  // Find header row
  var headerRow=-1;
  for(var hi=0;hi<Math.min(data.length,5);hi++){
    if(data[hi]&&data[hi].length>=4){
      var first=String(data[hi][0]||'').toLowerCase();
      if(first.indexOf('workflow')>=0||first.indexOf('component')>=0){headerRow=hi;break;}
    }
  }
  if(headerRow===-1)headerRow=0;

  // Detect column mapping from header
  var hdrCells=(data[headerRow]||[]).map(function(c){return String(c||'').toLowerCase().trim();});
  var colMap={wf:-1,ct:-1,cn:-1,fn:-1,im:-1,li:-1,de:-1,os:-1};
  for(var ci=0;ci<hdrCells.length;ci++){
    var h=hdrCells[ci];
    if(h.indexOf('workflow')>=0)colMap.wf=ci;
    else if(h.indexOf('component type')>=0||h==='type')colMap.ct=ci;
    else if(h.indexOf('component name')>=0||(h.indexOf('component')>=0&&h.indexOf('type')<0))colMap.cn=ci;
    else if(h.indexOf('failure')>=0||h.indexOf('mode')>=0)colMap.fn=ci;
    else if(h.indexOf('impact')>=0)colMap.im=ci;
    else if(h.indexOf('likelihood')>=0)colMap.li=ci;
    else if(h.indexOf('detect')>=0)colMap.de=ci;
    else if(h.indexOf('outage')>=0)colMap.os=ci;
  }

  var errors=[];
  var valid=[];

  for(var ri=headerRow+1;ri<data.length;ri++){
    var row=data[ri];
    if(!row||!row.some(function(c){return c!==undefined&&c!==null&&String(c).trim()!=='';}))continue;
    var rowNum=ri+1;
    var rowErrors=[];

    var cn=colMap.cn>=0?String(row[colMap.cn]||'').trim():'';
    var fn=colMap.fn>=0?String(row[colMap.fn]||'').trim():'';
    var ct=colMap.ct>=0?String(row[colMap.ct]||'').trim():'';
    var wf=colMap.wf>=0?String(row[colMap.wf]||'').trim():'';
    var im=colMap.im>=0?Number(row[colMap.im]):0;
    var li=colMap.li>=0?Number(row[colMap.li]):0;
    var de=colMap.de>=0?Number(row[colMap.de]):0;
    var os=colMap.os>=0?Number(row[colMap.os]):0;

    if(!cn)rowErrors.push('Component Name is required');
    if(!fn)rowErrors.push('Failure Mode is required');
    if(im&&(im<1||im>5||im!==Math.floor(im)))rowErrors.push('Impact must be 1-5');
    if(li&&(li<1||li>5||li!==Math.floor(li)))rowErrors.push('Likelihood must be 1-5');
    if(de&&(de<1||de>5||de!==Math.floor(de)))rowErrors.push('Detectability must be 1-5');
    if(os!==0&&os!==1&&os!==2)rowErrors.push('Outage must be 0, 1, or 2');
    if(ct&&ct!=='Application'&&ct!=='Platform')rowErrors.push('Component Type must be "Application" or "Platform"');

    if(rowErrors.length){
      errors.push('Row '+rowNum+': '+rowErrors.join('; '));
    } else {
      valid.push({ct:ct||'Application',cn:cn,fn:fn,im:im||0,li:li||0,de:de||0,os:os,wf:wf,rpv:0,rl:'',id:uid()});
    }
  }

  if(errors.length){
    var errHtml='<div style="max-height:300px;overflow-y:auto;text-align:left;font-size:.85rem"><ul style="margin:0;padding-left:18px">';
    errors.forEach(function(e){errHtml+='<li style="margin:4px 0;color:var(--red)">'+esc(e)+'</li>';});
    errHtml+='</ul></div>';
    SM('❌ Validation Errors ('+errors.length+')',errHtml+'<p style="margin-top:12px;color:var(--text2)">Fix the errors and try again. No data was imported.</p>');
    return;
  }

  if(!valid.length){
    SM('ℹ️ No Data','No valid data rows found in the file.');
    return;
  }

  // Count unique components
  var compSet={};
  valid.forEach(function(v){compSet[v.ct+'|'+v.cn]=true;});
  var compCount=Object.keys(compSet).length;

  var fmCreated=0,fmUpdated=0;
  valid.forEach(function(item){
    calcFM(item);
    // Deduplicate: update existing FM if same workflow+component+failure mode
    var existFM=S.p2.fm.find(function(f){return f.wf===item.wf&&f.cn===item.cn&&f.fn===item.fn;});
    if(existFM){
      existFM.ct=item.ct||existFM.ct;
      existFM.im=item.im||existFM.im;
      existFM.li=item.li||existFM.li;
      existFM.de=item.de||existFM.de;
      existFM.os=item.os!==undefined?item.os:existFM.os;
      calcFM(existFM);
      fmUpdated++;
    } else {
      S.p2.fm.push(item);
      fmCreated++;
    }
  });
  
  // Sync to health entities in Phase 3
  syncFMToHealthEntities(valid);
  cleanOrphanedHealthEntities();
  
  sv();RP(S.cp);
  SM('✅ Import Complete','Imported '+valid.length+' failure modes ('+fmCreated+' new, '+fmUpdated+' updated) across '+compCount+' components.');
}

function ulP2XLSX(wfName){
  var inp=document.createElement('input');inp.type='file';inp.accept='.xlsx';
  inp.onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(ev){
      var wb=XLSX.read(ev.target.result,{type:'array'});
      var errors=[];
      var mtUpdated=0,mtCreated=0,ctUpdated=0,ctCreated=0;

      // Sheet 1: Mitigations
      var mtSheet=wb.Sheets[wb.SheetNames[0]];
      if(mtSheet){
        var mtData=XLSX.utils.sheet_to_json(mtSheet,{header:1});
        var mtStart=0;
        for(var mi=0;mi<Math.min(mtData.length,3);mi++){
          if(mtData[mi]&&String(mtData[mi][0]||'').toLowerCase().indexOf('component')>=0){mtStart=mi+1;break;}
        }
        if(mtStart===0)mtStart=1;

        for(var mri=mtStart;mri<mtData.length;mri++){
          var mr=mtData[mri];
          if(!mr||!mr.some(function(c){return c!==undefined&&c!==null&&String(c).trim()!=='';}))continue;
          var mComp=String(mr[0]||'').trim();
          var mFm=String(mr[1]||'').trim();

          if(!mComp&&!mFm){errors.push('Mitigations Row '+(mri+1)+': Component and Failure Mode are required');continue;}
          if(!mComp){errors.push('Mitigations Row '+(mri+1)+': Component is required');continue;}
          if(!mFm){errors.push('Mitigations Row '+(mri+1)+': Failure Mode is required');continue;}

          var existing=S.p3.mt.find(function(m){return m.sc===mComp&&m.fm===mFm&&(m.wf===wfName||m.wi===wfName);});
          if(existing){
            existing.dm=String(mr[2]||'').trim()||existing.dm;
            existing.cm=String(mr[3]||'').trim()||existing.cm;
            existing.im=String(mr[4]||'').trim()||existing.im;
            existing.rp=String(mr[5]||'').trim()||existing.rp;
            mtUpdated++;
          } else {
            // Ensure a corresponding Phase 1 FM exists so the renderer can see it
            var p1Exists=S.p2.fm.find(function(f){return f.cn===mComp&&f.fn===mFm&&f.wf===wfName;});
            if(!p1Exists){
              // Check if the component already exists (to inherit its ct value, preventing duplicates)
              var existingComp=S.p2.fm.find(function(f){return f.cn===mComp&&f.wf===wfName;});
              var componentType=existingComp?existingComp.ct:'Application';
              S.p2.fm.push({id:uid(),_src:'xlsx-p2',wf:wfName,ct:componentType,cn:mComp,fn:mFm,im:0,li:0,de:0,os:1,rpv:0,rl:''});
            }
            // Deduplicate: don't push if mitigation already exists for this component+FM
            var existMt=S.p3.mt.find(function(m){return m.sc===mComp&&m.fm===mFm&&(m.wf===wfName||m.wi===wfName);});
            if(!existMt){
              S.p3.mt.push({id:uid(),_src:'xlsx',sc:mComp,fm:mFm,wi:wfName,dc:'',ci:'',
                cm:String(mr[3]||'').trim(),im:String(mr[4]||'').trim(),
                dm:String(mr[2]||'').trim(),rp:String(mr[5]||'').trim(),
                is:'',ow:'',wf:wfName});
            } else {
              existMt.dm=String(mr[2]||'').trim()||existMt.dm;
              existMt.cm=String(mr[3]||'').trim()||existMt.cm;
              existMt.im=String(mr[4]||'').trim()||existMt.im;
              existMt.rp=String(mr[5]||'').trim()||existMt.rp;
            }
            mtCreated++;
          }
        }
      }

      // Sheet 2: Chaos Tests
      if(wb.SheetNames.length>1){
        var ctSheet=wb.Sheets[wb.SheetNames[1]];
        if(ctSheet){
          var ctData=XLSX.utils.sheet_to_json(ctSheet,{header:1});
          var ctStart=0;
          for(var ci2=0;ci2<Math.min(ctData.length,3);ci2++){
            if(ctData[ci2]&&String(ctData[ci2][0]||'').toLowerCase().indexOf('failure')>=0){ctStart=ci2+1;break;}
          }
          if(ctStart===0)ctStart=1;

          for(var cri=ctStart;cri<ctData.length;cri++){
            var cr=ctData[cri];
            if(!cr||!cr.some(function(c){return c!==undefined&&c!==null&&String(c).trim()!=='';}))continue;
            var cFm=String(cr[0]||'').trim();
            if(!cFm)continue;

            var existCt=S.p3.ct.find(function(t){return t.fm===cFm&&t.wf===wfName;});
            if(existCt){
              existCt.ts=String(cr[1]||'').trim()||existCt.ts;
              existCt.it=String(cr[2]||'').trim()||existCt.it;
              existCt.eb=String(cr[3]||'').trim()||existCt.eb;
              ctUpdated++;
            } else {
              S.p3.ct.push({id:uid(),_src:'xlsx',fm:cFm,ts:String(cr[1]||'').trim(),
                it:String(cr[2]||'').trim(),tc:'',
                eb:String(cr[3]||'').trim(),ab:'',
                rt:'',pl:'',re:'',
                dv:'',ob:'',to:'',wf:wfName});
              ctCreated++;
            }
          }
        }
      }

      if(errors.length){
        var errHtml='<div style="max-height:300px;overflow-y:auto;text-align:left;font-size:.85rem"><ul style="margin:0;padding-left:18px">';
        errors.forEach(function(e){errHtml+='<li style="margin:4px 0;color:var(--red)">'+esc(e)+'</li>';});
        errHtml+='</ul></div>';
        SM('❌ Validation Errors ('+errors.length+')',errHtml+'<p style="margin-top:12px;color:var(--text2)">Fix the errors and try again. No data was imported.</p>');
        return;
      }

      // Sync components from mitigations to health entities
      if(mtCreated>0||mtUpdated>0){
        var mtComponents=[];
        S.p3.mt.forEach(function(m){
          if(m.wf===wfName||m.wi===wfName){
            var fm=S.p2.fm.find(function(f){return f.fn===m.fm&&f.cn===m.sc;});
            if(fm){
              mtComponents.push({wf:fm.wf||wfName,ct:fm.ct||'Application',cn:fm.cn});
            }
          }
        });
        if(mtComponents.length>0){
          syncFMToHealthEntities(mtComponents.map(function(c){
            return {wf:c.wf,ct:c.ct,cn:c.cn,fn:'',im:0,li:0,de:0,os:0,rpv:0,rl:'',id:uid()};
          }));
        }
      }
      cleanOrphanedHealthEntities();
      sv();RP(S.cp);
      var totalMt=mtUpdated+mtCreated;
      var totalCt=ctUpdated+ctCreated;
      SM('✅ Import Complete','Updated '+totalMt+' mitigations ('+mtCreated+' new, '+mtUpdated+' updated) and '+totalCt+' chaos tests ('+ctCreated+' new, '+ctUpdated+' updated).');
    };
    rd.readAsArrayBuffer(f);
  };
  inp.click();
}

  hmWs['!cols']=[{wch:18},{wch:28},{wch:32},{wch:25},{wch:14},{wch:32}];
  hmWs['!freeze']={xSplit:0,ySplit:3};
  XLSX.utils.book_append_sheet(wb,hmWs,'Health Model');

  // Sheet 6: Health Signals
  const signals=S.p4.he.filter(e=>e.et==='Signal');
  const hsd=[['Health Signals'],[],
    ['Workflow','Component Name','Signal / Metric Name','Threshold','Linked FM ID','Linked FM Name','FM Coverage Alignment','Notes'],
    ...signals.map(e=>[e.wf||'',e.en||'',e.mn||'',e.th||'',e.fmId||'',e.fmName||'',e.vs||'',e.nt||''])];
  const hsWs=XLSX.utils.aoa_to_sheet(hsd);
  hsWs['!cols']=[{wch:25},{wch:28},{wch:32},{wch:20},{wch:16},{wch:32},{wch:22},{wch:32}];
  hsWs['!freeze']={xSplit:0,ySplit:3};
  XLSX.utils.book_append_sheet(wb,hsWs,'Health Signals');

  // Sheet 7: Operations & Governance
  const rpvFMs=S.p2.fm.filter(f=>f.rpv>0);
  const avgRPV=rpvFMs.length?Math.round(rpvFMs.reduce((s,f)=>s+f.rpv,0)/rpvFMs.length):0;
  const coveredLeaves=S.p4.he.filter(e=>e.et==='Application'||e.et==='Platform')
    .filter(e=>S.p4.he.some(s=>s.et==='Signal'&&s.en===e.en&&(e.wf?s.wf===e.wf:true)&&s.mn&&s.th));
  const totalLeaves=S.p4.he.filter(e=>e.et==='Application'||e.et==='Platform').length;
  const ond=[['Operations Summary'],[],
    ['Metric','Value'],
    ['Total Failure Modes',S.p2.fm.filter(f=>f.fn&&f.cn).length],
    ['Critical Workflows',S.p1.wf.filter(w=>w.nm&&getWorkflowCriticality(w.nm).maxRPV>=50).length],
    ['Average RPV',avgRPV],
    ['Mitigation Coverage %',Math.round((S.p3.mt.filter(m=>m.dm&&m.cm&&m.im&&m.rp).length/(S.p3.mt.length||1))*100)],
    ['Chaos Tests Defined',S.p3.ct.filter(t=>t.ts||t.it||t.eb).length],
    ['Chaos Tests Passed',S.p3.ct.filter(t=>t.rt==='Pass').length],
    ['Health Model Entities',hmEntities.length],
    ['Health Signals Defined',signals.length],
    ['Signal Coverage %',totalLeaves?Math.round((coveredLeaves.length/totalLeaves)*100):0],
    [],[],['Governance Model'],[],
    ['Governance Area','Owner','Review Frequency','Artifacts Reviewed','Output'],
    ...S.p5.gv.map(g=>[g.ar||'',g.ow||'',g.fr||'',g.af||'',g.op||''])];
  const onWs=XLSX.utils.aoa_to_sheet(ond);
  onWs['!cols']=[{wch:30},{wch:32},{wch:20},{wch:30},{wch:32}];
  onWs['!freeze']={xSplit:0,ySplit:3};
  XLSX.utils.book_append_sheet(wb,onWs,'Operations & Governance');

  XLSX.writeFile(wb,'FMA_HealthModel_Export.xlsx');
}

// ===== JSON =====
function EJ(){
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fma_backup.json';a.click();URL.revokeObjectURL(a.href);
}
function IJ(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=ev=>{try{Object.assign(S,JSON.parse(ev.target.result));migrateV2toV3();migrateP4P5();sv();RS();RP(S.cp);SM('✅ Import OK','Data restored successfully.');}catch(er){SM('❌ Error','Invalid JSON: '+er.message);}};
    r.readAsText(f);};inp.click();
}

function CR(){SM('⚠️ Reset All Data','<p style="margin-bottom:16px">This permanently deletes all data. Cannot be undone.</p><div style="display:flex;gap:8px"><button class="btn btn-danger" onclick="DR2()">Yes, Reset</button><button class="btn btn-secondary" onclick="HM()">Cancel</button></div>');}
function DR2(){S=ds();sv();RS();RP(0);const wh=document.getElementById('wn-hdr');if(wh)wh.textContent='';HM();}

function SM(t,c){$('#modal-c').innerHTML=`<h3>${t}</h3><div>${c}</div>`;$('#modal-o').classList.add('show');}
function HM(){$('#modal-o').classList.remove('show');}
// Backdrop click disabled for import modals — X button only

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!_deployInProgress&&!window._zoomOverlayOpen&&!window._importModalOpen){window._importUILocked=false;HM();}
  if(e.ctrlKey&&e.key==='s'){e.preventDefault();EJ();}
  if(e.ctrlKey&&e.key==='e'){e.preventDefault();EX();}
});

// ===== Theme Toggle =====
function getEffectiveTheme(choice){
  if(choice==='auto') return window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  return choice;
}
function applyTheme(choice){
  localStorage.setItem('fma_theme',choice);
  document.documentElement.setAttribute('data-theme',getEffectiveTheme(choice));
  document.querySelectorAll('#theme-toggle .theme-btn').forEach(b=>{
    b.classList.toggle('active',b.getAttribute('data-theme-val')===choice);
  });
}
(function initThemeToggle(){
  const choice=localStorage.getItem('fma_theme')||'dark';
  applyTheme(choice);
  document.querySelectorAll('#theme-toggle .theme-btn').forEach(b=>{
    b.addEventListener('click',()=>applyTheme(b.getAttribute('data-theme-val')));
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{
    if((localStorage.getItem('fma_theme')||'dark')==='auto') applyTheme('auto');
  });
})();

RS();RP(S.cp);
if(S.wn){const el=document.getElementById('wn-hdr');if(el)el.textContent='— '+S.wn;}
